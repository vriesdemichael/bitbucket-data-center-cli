version: 1
updated_at: "2026-08-27"
source_openapi: docs/reference/atlassian/bitbucket-openapi.json

# The registry had never been exercised end to end. It was, during the bump from
# Bitbucket 10.2 to 10.4.
validation:
  date: "2026-08-27"
  bitbucket_version: "10.4.2"

  # A verification command passing means the workaround still works. It does not
  # mean the workaround is still needed: the command exercises code with the fix
  # applied, so it passes just as well after Atlassian repairs the underlying
  # defect. ADR-028 asks for an entry to be removed once upstream improves, and a
  # green command is not evidence for that either way.
  #
  # Whether a fix is still needed is a separate question, answered per entry
  # under still_required below.
  commands:
    status: pass
    detail: >
      Every verification command in the registry was run against 10.4.2 and passed.
      The offline ones (task models:verify, task client:verify, task openapi:verify,
      go build, and each named go test) ran directly. The -tags live ones ran against
      a local SDK-licensed 10.4.2 instance as part of the full suite.
  live_suite:
    status: pass
    detail: >
      go test -tags=live ./tests/integration/live against a local Bitbucket 10.4.2
      container: 0 failures in 551s, no skips.

  # A green live suite is not evidence that a divergence still exists either. The
  # workaround is in the path, so the test passes whether or not Atlassian has
  # since repaired the cause. Proving the cause still holds means observing the
  # unmitigated behaviour: reading the raw published document, or calling the
  # server directly with none of this project's code involved.
  #
  # Entries carry status_evidence saying which was done. "active" means the cause
  # was re-observed on 10.4; "active-not-reprobed" means only the workaround was
  # exercised and the cause is assumed, not shown.
  reprobed_unmitigated:
    method: >
      Raw HTTP against the running 10.4.2 instance with basic auth and no bb code in
      the path, plus direct inspection of the unsanitized published document.
    findings: >
      OPENAPI-011: POST /ssh/latest/keys answered "createdDate":1787787636512, a number,
      where the published document declares string/date-time on ten schemas.

      OPENAPI-008: a missing resource answered 404 with an errors array carrying
      exceptionName; an unrouted endpoint answered 404 with a status-code/sub-code
      document. Both still 404, still distinguishable only by body.

      OPENAPI-010: $ref reachability from every operation covers 236 of 295 schemas;
      the four excluded ones are not among them.

      OPENAPI-013, -014, -015, -019, -020: the published document still declares each
      disputed shape exactly as recorded.

      OPENAPI-002: three operationIds are still reused across unrelated endpoints.
    not_reprobed: >
      OPENAPI-005, -006, -007, -012, -016, -017, -018 and the server half of -013, -015
      and -019. Each is exercised by a live test that passes, which shows the workaround
      still works and nothing more. Re-probing them needs a bespoke unmitigated call per
      entry; worth doing, not done here.

  # Something the registry asserted that is no longer true.
  corrections:
    openapi_014_is_no_longer_unique: >
      The entry states that commitId is the only parameter in the spec declared with
      content rather than schema. In 10.4 there is a second: the user query parameter on
      POST /ssh/latest/keys, declared as content.application/json with a $ref to
      RestSshKey, for a value its own description calls "the username of the user".
      The sanitizer's fix is scoped to in:path parameters, so this one is untouched and
      oapi-codegen emits AddSshKeyParams.User as *RestSshKey -- an entire key object
      where a username belongs. Nothing in this project calls AddSshKey, so there is no
      impact today; it is a trap for whoever adds an ssh-key command.

  # Where each divergence actually lives. The distinction matters because only the
  # first kind can ever be fixed by Atlassian shipping a better document.
  divergence_sources:
    published_spec_contradicts_itself: >
      OPENAPI-001 (path placeholders present in the URL template but undeclared) and
      OPENAPI-002 (operationIds reused across unrelated endpoints, which OpenAPI 3.0
      forbids outright). Both still present in 10.4: the sanitizer reports
      "fixed path params=1 renamed operationIds=3" on this spec.
    published_spec_contradicts_the_server: >
      The large majority. OPENAPI-005, -007, -008, -011 through -020 all record the
      server returning something the document says it will not: epoch millis where a
      date-time string is declared, a string where an object is declared, an integer
      body where an object is declared, and so on. These are only discoverable by
      calling the server, which is why the live suite is the real gate here.
      Every one of them still reproduces on 10.4 -- the sanitizer still rewrites
      11 schema fields, 1 property, 3 array properties and 1 array response.
    generator_or_language_limit: >
      OPENAPI-003, -010 and -021. The spec is accurate; Go or oapi-codegen cannot
      express it. OPENAPI-010's four schemas form a required, non-nullable value
      cycle Go cannot size.
    our_own_tooling: >
      OPENAPI-009, -022 and -023 record defects in this project rather than in
      Bitbucket: nondeterministic suffix assignment, no guard against an operation
      silently changing endpoint, and a spec version pinned separately from the
      release under test.

  still_required:
    confirmed_still_needed: >
      OPENAPI-001, -002, -005, -007, -008, -010, -011 through -020. Each underlying
      condition was checked against the 10.4 document or reproduced by the live suite.
      OPENAPI-010 in particular: the four excluded schemas are still defined, still
      cyclic, and still unreachable from any operation (236 of 295 schemas are
      reachable; these four are not), so the exclusion remains both necessary and safe.
    no_longer_fires: >
      OPENAPI-003. The post-generation dedupe pass reports "removed=0" on 10.4 and
      reported the same on 10.2, so it has not removed a declaration on either spec
      this project has vendored. It is retained as a guard rather than deleted,
      because the collision it defends against is a property of the input spec and
      costs one pass to keep, but it should not be read as evidence of a live defect.
    reclassified: >
      OPENAPI-009 understated the problem. Suffix numbering was assumed to be a
      consequence of this project canonicalising operationIds before re-suffixing.
      It is not: Atlassian's own operationIds re-point between releases. Comparing
      10.2 to 10.4, 11 upstream operationIds now name a different endpoint, including
      delete_6 and delete_7, which moved from the reviewer-group endpoints to the new
      change-author ones. Preserving upstream ids verbatim would not have helped.
      OPENAPI-022 exists because nothing else can catch this.

fixes:
  - id: OPENAPI-001
    area: spec-path-parameters
    source: published-spec-self-contradiction
    status: active
    status_evidence: >
      Re-probed on 10.4: the sanitizer still injects a missing path parameter.
    description: Add missing path parameter declarations required by oapi-codegen.
    reference:
      type: endpoint
      value: /api/latest/projects/{projectKey}/repos/{repositorySlug}/secret-scanning/exempt
      upstream_issue: positional path params present in URL template but absent from operation parameters
    change:
      files:
        - tools/openapi-sanitize/main.go
      detail: >
        The sanitizer injects required path parameters into operations when placeholders are present
        in the route template but not declared in the OpenAPI operation parameter list.
    verification:
      commands:
        - task models:generate
        - task client:generate

  - id: OPENAPI-002
    area: spec-operationid-collisions
    source: published-spec-self-contradiction
    status: active
    status_evidence: >
      Re-probed on 10.4: three operationIds are still reused across unrelated endpoints, which OpenAPI
      3.0 forbids.
    description: Normalize and de-duplicate operationIds to keep generated symbols deterministic and unique.
    reference:
      type: generation
      value: oapi-codegen operation/type naming
      upstream_issue: duplicate or empty operationIds can create conflicting generated declarations
    change:
      files:
        - tools/openapi-sanitize/main.go
      detail: >
        The sanitizer canonicalizes operationIds and applies stable suffixing when collisions are found,
        including generation of fallback operationIds for operations missing one.
    verification:
      commands:
        - task models:verify
        - task client:verify

  - id: OPENAPI-003
    area: model-generation-dedupe
    source: generator-or-language-limit
    status: dormant
    status_evidence: >
      The dedupe pass reports removed=0 on 10.4 and reported the same on 10.2. It has never removed a
      declaration on a spec this project vendored. Kept as a guard, not evidence of a live defect.
    description: Preserve a deterministic cleanup step for generated model type collisions.
    reference:
      type: generation
      value: internal/models/generated/bitbucket_types.gen.go
      upstream_issue: duplicate type declarations can be emitted for specific schema combinations
    change:
      files:
        - tools/oapi-fix-generated/main.go
        - Taskfile.yml
      detail: >
        models:generate runs a post-generation dedupe pass that removes repeated type declarations
        while preserving first occurrence and formatting output with gofmt.
    verification:
      commands:
        - task models:verify

  - id: OPENAPI-004
    area: live-contract-parity
    source: project-test-practice
    status: active
    status_evidence: >
      Not a divergence: this records how the parity test is seeded. Exercised by the live suite.
    description: Seed live data before parity checks to validate non-empty contract behavior.
    reference:
      type: test
      value: tests/integration/live/openapi_parity_test.go
      upstream_issue: empty-list parity can pass without validating end-to-end contract fidelity
    change:
      files:
        - tests/integration/live/openapi_parity_test.go
        - internal/services/repository/service.go
      detail: >
        The live test provisions a unique user, project, and repository, retrieves project-scoped
        repositories through both manual and generated clients, asserts seeded repository presence,
        and performs cleanup.
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestOpenAPIParity

  - id: OPENAPI-005
    area: pull-request-settings-required-approvers
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Exercised by its live test on 10.4.2, which passes with the workaround in the path. The cause
      was not re-probed unmitigated, so this does not establish that the server still rejects the
      object payload.
    description: Support legacy integer payload fallback for requiredApprovers updates.
    reference:
      type: endpoint
      value: /api/latest/projects/{projectKey}/repos/{repositorySlug}/settings/pull-requests
      upstream_issue: OpenAPI models requiredApprovers as an object, but some live instances reject object payloads and only accept an integer
    change:
      files:
        - internal/services/reposettings/service.go
        - internal/services/reposettings/service_test.go
      detail: >
        Update flow sends the modern object payload first ({enabled,count}) and falls back to
        the legacy integer payload when the server returns a validation-style payload error.
        This preserves compatibility with environments where the documented object contract
        is not accepted at runtime.
    verification:
      commands:
        - go test ./internal/services/reposettings -run TestUpdateRepositoryPullRequestRequiredApproversCount
        - go test -tags=live ./tests/integration/live -run TestLiveRepoSettingsUpdatePullRequestRequiredApprovers

  - id: OPENAPI-006
    area: pull-request-activities-comment-payload
    source: published-spec-incomplete
    status: active-not-reprobed
    status_evidence: >
      Exercised by its live tests on 10.4.2. The generated activity model still omits the nested
      comment payload; that the raw decode is still required was not independently re-probed.
    description: Parse raw pull request activity payloads to recover comment details omitted by the generated activity model.
    reference:
      type: endpoint
      value: /api/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/activities
      upstream_issue: generated RestPullRequestActivity omits the nested comment payload needed for aggregate PR comment retrieval
    change:
      files:
        - internal/services/pullrequestactivity/service.go
        - tests/integration/live/repo_cli_live_test.go
      detail: >
        The client keeps using the generated activities endpoint, but decodes the raw response body into
        an internal activity adapter so nested comment objects and anchors remain available for aggregate
        pull request comment listing and AI/debug activity inspection.
    verification:
      commands:
        - go test ./internal/services/pullrequestactivity ./internal/cli ./internal/mcp
        - go test -tags=live ./tests/integration/live -run TestLiveCLIRepoListAndComments -count=1

  - id: OPENAPI-007
    area: pull-request-activities-anchor-path
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Exercised by its live test on 10.4.2. Whether the server still serialises anchor.path as a
      string was not re-probed unmitigated.
    description: Accept string anchor paths on pull request activity comments, which the spec models as an object.
    reference:
      type: endpoint
      value: /api/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/activities
      upstream_issue: >
        The activity timeline serialises an inline comment's anchor.path (and anchor.srcPath) as a plain
        string, while RestComment.Anchor.Path is an object with name/parent/extension/components. Verified
        against Bitbucket Data Center 10.2.1. A single inline comment therefore made the whole activity page
        fail to decode, so pull requests carrying inline review comments returned no comments at all.
    change:
      files:
        - internal/services/pullrequestactivity/service.go
        - internal/services/pullrequestactivity/threads_test.go
        - tests/integration/live/pr_review_visibility_live_test.go
      detail: >
        Before unmarshalling a comment into the generated model, string anchor paths are rewritten into the
        documented object shape (name, parent, extension, components), recursively across replies and parent
        comments. Payloads already using the object form are left untouched.
    verification:
      commands:
        - go test ./internal/services/pullrequestactivity -run 'AnchorPaths|PathObject' -count=1
        - go test -tags=live ./tests/integration/live -run TestLivePullRequestReviewVisibility -count=1

  - id: OPENAPI-008
    area: not-found-route-vs-resource
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Re-probed on 10.4.2 with no workaround in the path. A missing resource answers 404 with an
      errors array carrying exceptionName; an unrouted endpoint answers 404 with a
      status-code/sub-code document. The spec models both identically. Note the unrouted body is JSON
      on 10.4.2, not the XML recorded when this was written; the detector keys on the absence of the
      errors array, so it is unaffected.
    description: Distinguish a retired endpoint from a missing resource, which the spec models identically as 404.
    reference:
      type: generation
      value: 404 response semantics across all Bitbucket endpoints
      upstream_issue: >
        The OpenAPI spec declares a single 404 response per operation, but Bitbucket answers two
        different situations with it. A resource that does not exist returns the Bitbucket error
        envelope, which always carries an "errors" array
        ({"errors":[{...,"exceptionName":"...NoSuchPullRequestException"}]}). A route the application
        never registered never reaches that layer, so the servlet container answers with a status
        document instead ({"message":"HTTP 404 Not Found","status-code":404,"sub-code":-1}). That
        document is content-negotiated: clients sending Accept application/json receive the JSON form
        above, while clients that do not receive the XML equivalent
        (<status><status-code>404</status-code>...</status>). The detection therefore keys on the
        absence of the "errors" array rather than on the content type, so both forms are covered.
        Without the distinction a client reports a plain "not found" for a call that could never
        succeed, which is how the retired pull request task endpoint went unnoticed after Bitbucket
        8.0 removed it.
    change:
      files:
        - internal/openapi/errors.go
        - internal/openapi/errors_test.go
        - internal/services/pullrequestactivity/service.go
        - tests/integration/live/pr_review_visibility_live_test.go
      detail: >
        MapStatusError inspects the body of a 404 and attaches ErrRouteMissing as the cause when the
        payload is not a Bitbucket error envelope. Callers use openapi.IsRouteMissing to degrade only
        for features the server does not expose, and to report everything else. Verified against
        Bitbucket Data Center 10.2.1 for retired endpoints, unknown routes, missing pull requests and
        missing repositories.
    verification:
      commands:
        - go test ./internal/openapi -run IsRouteMissing -count=1
        - go test ./internal/services/pullrequestactivity -run TrySummarize -count=1
        - go test -tags=live ./tests/integration/live -run TestLiveRouteMissingClassification -count=1

  - id: OPENAPI-009
    area: spec-operationid-nondeterminism
    source: this-project
    status: active
    status_evidence: >
      A defect in this project's sanitizer, not in Bitbucket. See the reclassification note in the
      validation block: the underlying instability is upstream.
    description: Make operationId collision suffixes deterministic so the generated client is reproducible.
    reference:
      type: generation
      value: tools/openapi-sanitize operationId suffixing
      upstream_issue: >
        Bitbucket reuses operationIds across unrelated endpoints (six "get", two "getStatus", and so on),
        so the sanitizer suffixes collisions. It assigned those suffixes while ranging over the spec's
        paths map, and Go randomises map iteration, so the same spec produced a different
        operationId-to-endpoint mapping on every run. Whether Get3WithResponse called
        /basicauth/latest/config or a pull request endpoint was decided by chance at generation time.
        Nothing caught it because models:verify and client:verify are not run by CI.
    change:
      files:
        - tools/openapi-sanitize/main.go
        - tools/openapi-sanitize/main_test.go
      detail: >
        Paths are sorted before assignment, making the mapping a pure function of the spec. Collision
        suffixing also now keeps incrementing until the canonical id is free, because Bitbucket 10.2
        ships an operation already named "get_2" and blind suffixing produced duplicate Go declarations.
    verification:
      commands:
        - go test ./tools/openapi-sanitize -count=1
        - task client:verify
        - task models:verify

  - id: OPENAPI-010
    area: unreachable-recursive-schemas
    source: generator-or-language-limit
    status: active
    status_evidence: >
      Re-probed on 10.4 by walking $ref reachability from every operation: 236 of 295 schemas are
      reachable and these four are not. Still defined, still cyclic, still unreferenced, so the
      exclusion is still necessary and still safe.
    description: Exclude Bitbucket 10.2 domain schemas that Go cannot express and no operation uses.
    reference:
      type: generation
      value: components.schemas Comment, CommentThread, PullRequest, PullRequestParticipant
      upstream_issue: >
        Bitbucket 10.2 added four schemas that reference each other through required, non-nullable
        $refs (Comment.thread <-> CommentThread.rootComment, PullRequest.author <->
        PullRequestParticipant.pullRequest). Go cannot size such a value cycle, so generation produced
        code that would not compile. No path operation references any of them; the wire types remain
        RestComment and RestPullRequest.
    change:
      files:
        - tools/oapi-codegen/bitbucket-types.yaml
        - tools/oapi-codegen/bitbucket-client.yaml
      detail: >
        Both codegen configurations exclude the four schemas. If a future spec makes them reachable
        from an operation, generation will fail loudly rather than silently omitting a used type.
    verification:
      commands:
        - task models:generate
        - task client:generate
        - go build ./...

  - id: OPENAPI-011
    area: spec-schema-field-types
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Re-probed on 10.4.2 with no workaround in the path: POST /ssh/latest/keys returned
      "createdDate":1787787636512, a number, where the raw spec declares string/date-time. Ten schemas
      still carry the wrong declaration.
    description: >
      Correct createdDate fields that the spec declares as string/date-time but the server returns
      as epoch milliseconds.
    reference:
      type: schema
      value: every createdDate property declared as string/date-time, spec-wide
      upstream_issue: >
        Bitbucket encodes createdDate as epoch milliseconds, but the spec declares it
        {"type": "string", "format": "date-time"} in 11 places while declaring it as an integer in
        16 others. oapi-codegen emits *time.Time for a date-time field, and time.Time.UnmarshalJSON
        accepts only an RFC 3339 string, so every response carrying one of those 11 fields failed to
        decode with "Time.UnmarshalJSON: input is not a JSON string".

        Three user-facing commands were broken by this and none of them were caught by the live
        suite, because each fails only when the collection is non-empty and the seeded fixtures
        leave them empty:
          - bb auth token create   (RestRawAccessToken.createdDate)
          - bb ssh-key list        (RestSshKey.createdDate)
          - bb repo ssh-key list   (RestSshAccessKey.key.createdDate, nested in an inline object)

        bb auth token create was the worst of the three: the request succeeded and the token was
        created on the server, but the response decode failed, so the user saw an error, never saw
        the token secret, and left a live token behind.

        Confirmed still present upstream in the 10.4 spec
        (https://dac-static.atlassian.com/server/bitbucket/10.4.swagger.v3.json), so this is not
        resolved by vendoring a newer artifact.
    change:
      files:
        - tools/openapi-sanitize/main.go
        - internal/cli/cmd/auth/token.go
        - internal/services/sshkey/service.go
        - internal/services/branch/service.go
        - internal/services/project/restriction.go
      detail: >
        The sanitizer rewrites every createdDate property declared as string/date-time to
        integer/int64 before generation, walking the whole document rather than a list of named
        schemas.

        Scoping by field name rather than by schema is deliberate. The same object shape appears
        inline in several request and response bodies, and oapi-codegen emits those as anonymous
        structs: rewriting only some occurrences leaves otherwise-identical shapes incompatible and
        the generated code stops compiling. Field-name scope also matches the encoding Bitbucket
        actually uses, which is why 16 of the 27 declarations were already integers.

        The rewrite is guarded on the broken shape, so if Atlassian corrects the spec their
        declaration is left untouched rather than forced back to this workaround.

        Hand-written anonymous struct literals in the services mirrored the previous generated
        shape and were updated to match. internal/cli/cmd/auth/token.go renders the value through
        formatEpochMillis, preserving the RFC 3339 output these commands have always printed.

        Only createdDate is rewritten. Other date fields in the spec (expiryDate, lastSeenDate,
        lockAcquireTime, initialSyncDate, lastSyncDate, last-updated, enabledAt) remain *time.Time
        because their encoding has not been observed against a running server, and rewriting an
        unverified field would introduce the mirror-image defect.
    verification:
      commands:
        - task models:generate
        - task client:generate
        - go build ./...
        - bb auth token create "verify" --permission REPO_READ
        - bb ssh-key list
        - bb repo ssh-key list --repo PROJECT/repo

  - id: OPENAPI-012
    area: spec-parameter-requiredness
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Exercised by its live test on 10.4.2. The 500-on-missing-url behaviour was not re-probed
      unmitigated.
    description: >
      Send the url query parameter on the webhook test endpoints, which the server requires even
      though the spec marks it optional.
    reference:
      type: endpoint
      value: >
        POST /api/latest/projects/{projectKey}/repos/{repositorySlug}/webhooks/test and
        POST /api/latest/projects/{projectKey}/webhooks/test
      upstream_issue: >
        Both operations declare webhookId, url and sslVerificationRequired as optional query
        parameters. In practice the server needs url: calling with webhookId alone throws an
        unhandled exception and answers 500 rather than a validation error naming the missing
        parameter.

        Probed directly against a running instance, same webhook each time:
          webhookId only, empty body  -> 500  (this is what bb sent)
          webhookId + url             -> 200
          url alone                   -> 200

        The server log records it as an UnhandledExceptionMapper entry, not a rejection, which is
        why the response carries no usable message.

        The consequence was that bb webhook test and bb project webhook test had never worked on
        any version. Neither had a live test — they were two of the 102 commands the coverage gate
        grandfathered — so nothing contradicted the assumption that the spec's optional meant
        optional.
    change:
      files:
        - internal/services/reposettings/service.go
        - internal/services/project/webhook.go
        - internal/cli/webhook.go
        - internal/cli/project_webhook.go
      detail: >
        TestWebhook and TestProjectWebhook now resolve the webhook's stored url and pass it
        alongside webhookId, rather than requiring the caller to repeat a value the server already
        holds. A webhook with no url yields a validation error naming --url instead of a 500.

        Both commands also accept an explicit --url override. That is not a workaround but the
        endpoint's documented purpose — "test connectivity to a specific endpoint" — so testing a
        candidate url before saving it is a first-class use rather than an accident of the fix.

        The empty JSON body bb already sent is unchanged; it is the missing query parameter that
        the server chokes on, not the body.

        This is the same root cause as the partial-update failure tracked separately: both were bb
        sending an incomplete webhook payload. Update needs the whole webhook because that endpoint
        replaces it; test needs the url because that endpoint tests a url.
    verification:
      commands:
        - go build ./...
        - go test ./internal/services/reposettings/ ./internal/services/project/
        - bb webhook test <id> --repo PROJECT/repo
        - bb webhook test <id> --repo PROJECT/repo --url http://localhost:7990/status
        - bb project webhook test PROJECT <id>

  - id: OPENAPI-013
    area: spec-body-requiredness
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Spec side re-probed on 10.4: RestDefaultTaskRequest still lists only description as required, so
      the matchers the server demands are still optional in the document. The server-side rejection
      was not re-probed.
    description: >
      Always send both default-task ref matchers, with a type id drawn from the schema enum, because
      the server rejects a default task that omits either one.
    reference:
      type: endpoint
      value: >
        POST and PUT /default-tasks/latest/projects/{projectKey}/tasks and
        POST and PUT /default-tasks/latest/projects/{projectKey}/repos/{repositorySlug}/tasks
      upstream_issue: >
        RestDefaultTaskRequest declares sourceMatcher and targetMatcher as optional properties. The
        server requires both: a request carrying only a description is rejected with "A sourceMatcher
        with ID and type is required when creating or updating a default task."

        Separately, bb sent the matcher type id ANY_REF_MATCHER, which is not one of the five values
        the schema enum lists (ANY_REF, BRANCH, PATTERN, MODEL_CATEGORY, MODEL_BRANCH). That value
        appears to have been taken from a response rather than the schema: on a successful create the
        server echoes the any-ref matcher's *id* as ANY_REF_MATCHER_ID, which reads like a type name
        but is not one.

        Probed directly against a running instance, POST to the project endpoint:
          description only                                  -> 400  sourceMatcher required
          type id ANY_REF_MATCHER                            -> 400  Unable to get ref matcher for type
          type id ANY_REF, id ANY_REF                        -> 200
          PATTERN refs/heads/feature/* + BRANCH refs/heads/master -> 200
          type name sent empty                               -> 200  (schema marks it required)

        The consequence was that bb repo default-task add|update and bb project default-task
        add|update had never worked in any form: without the flags the request was rejected for the
        missing matchers, and with them for the invented type. All four were among the commands the
        live-coverage gate grandfathered, so nothing contradicted either assumption.
    change:
      files:
        - internal/openapi/refmatcher.go
        - internal/services/reposettings/service.go
        - internal/services/project/default_task.go
        - internal/cli/repo_commands.go
        - internal/cli/project_default_task.go
      detail: >
        A shared builder now constructs both matchers for all four call sites, which previously
        carried eight copies of the same wrong literal.

        The matcher type is inferred from the ref rather than asked for, because the ref already
        determines it: a glob can only be a PATTERN and anything else can only be a BRANCH. An unset
        --source-ref or --target-ref becomes an ANY_REF matcher, which is what the flag being
        optional has to mean given that the field is not.

        MODEL_CATEGORY and MODEL_BRANCH matchers are not reachable through these flags. They match on
        branching-model names rather than refs, so they do not belong to a flag called --source-ref;
        expressing them would need a separate flag and is left until something asks for it.

        The type name is sent correctly even though the server tolerates it empty, since the schema
        marks it required and a future version may enforce that.
    verification:
      commands:
        - go build ./...
        - go test ./internal/openapi/ ./internal/services/reposettings/ ./internal/services/project/
        - go test -tags live -run TestLiveRepoDefaultTaskLifecycle ./tests/integration/live/

  - id: OPENAPI-014
    area: spec-parameter-serialization
    source: published-spec-self-contradiction
    status: active
    status_evidence: >
      Re-probed on 10.4: commitId is still declared with content rather than schema. The claim that it
      is the only such parameter no longer holds -- see the second instance noted below.
    description: >
      Rewrite path parameters declared with a content map into a plain schema, so the generated
      client sends the value as a path segment rather than as JSON.
    reference:
      type: endpoint
      value: GET /branch-utils/latest/projects/{projectKey}/repos/{repositorySlug}/branches/info/{commitId}
      upstream_issue: >
        commitId is declared with content.application/json rather than schema. Per OpenAPI that asks
        for the value to be serialized as JSON, and oapi-codegen honours it: the generated request
        builder calls json.Marshal on the commit id instead of the usual style-based encoding, so the
        path segment arrives wrapped in literal double quotes.

        Bitbucket passes the quoted string straight to git, which rejects it:
          'git branch --no-color --contains "\"<sha>\"" --list -- master' exited with code 129
          saying: error: malformed object name

        Probed directly against a running instance, same repository and commit:
          GET branches/info/<sha>            -> 200, lists refs/heads/master
          GET branches/info/<sha>?start=0&limit=25 -> 200
          bb branch model inspect <sha>      -> 500 (the id arrives quoted)

        The argument is irrelevant to the failure: a branch name fails the same way, because the
        quotes are what git cannot parse. This is the only parameter in the 10.2 spec declared this
        way, and every other endpoint taking a commit id declares it as a plain string, so it reads
        as an upstream slip rather than an intended encoding.

        The consequence was that bb branch model inspect had never worked against any server for any
        input. It was among the commands the live-coverage gate grandfathered.
    change:
      files:
        - tools/openapi-sanitize/main.go
        - internal/openapi/generated/bitbucket_client.gen.go
        - internal/models/generated/bitbucket_types.gen.go
      detail: >
        The sanitizer now moves content.application/json.schema onto the parameter as schema and
        drops the content map, for path parameters that do not already declare one. The regenerated
        client encodes commitId with StyleParamWithLocation like every other path parameter.

        The pass is written against the shape rather than against this one endpoint, so a future spec
        revision that declares another parameter the same way is fixed on regeneration instead of
        shipping the same defect again. It reports its count alongside the other sanitizer counts,
        which is what would make a new occurrence visible.
    verification:
      commands:
        - task models:generate
        - task client:generate
        - go build ./...
        - go test -tags live -run TestLiveBranchModelInspect ./tests/integration/live/

  - id: OPENAPI-015
    area: spec-property-naming
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Spec side re-probed on 10.4: RestApplySuggestionRequest still declares commitMessage and still
      omits it from required.
    description: >
      Send the applied-suggestion commit message as message rather than commitMessage, and treat it
      as required.
    reference:
      type: endpoint
      value: >
        POST /api/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/comments/{commentId}/apply-suggestion
      upstream_issue: >
        RestApplySuggestionRequest declares an optional commitMessage property. The server reads the
        message from a property named message, and requires it.

        Probed directly against a running instance, same suggestion comment each time:
          commentVersion + pullRequestVersion + suggestionIndex + commitMessage -> 400 'message' cannot be null or empty
          the same three fields alone                                           -> 400 'message' cannot be null or empty
          the same three fields plus message                                    -> 204, suggestion applied

        The identical answer with and without commitMessage is what shows the property is simply not
        read: the server is reporting a missing message either way.

        The consequence was that bb pr comment apply-suggestion had never worked, with or without
        --commit-message. It was among the commands the live-coverage gate grandfathered.
    change:
      files:
        - tools/openapi-sanitize/main.go
        - internal/cli/insights_pr_admin_commands.go
        - internal/models/generated/bitbucket_types.gen.go
        - internal/openapi/generated/bitbucket_client.gen.go
      detail: >
        The sanitizer gained a small table of confirmed property renames and applies them to the
        component schemas; RestApplySuggestionRequest.commitMessage becomes message and joins the
        required list, so the regenerated type carries a non-pointer Message field.

        The --commit-message flag keeps its name, since that is what it means to the user, and now
        defaults to a message naming the comment when it is not given. Requiring the flag would have
        been the smaller change but a worse one: the server requires a message, not that the user
        supply one, and Bitbucket's own UI writes a default.

        The rename table is deliberately narrow. An entry belongs there only where sending the
        documented name has been observed to fail and the other name to work; it is not a place to
        tidy up names that merely read awkwardly.
    verification:
      commands:
        - task models:generate
        - task client:generate
        - go build ./...
        - go test -tags live -run TestLivePullRequestApplySuggestion ./tests/integration/live/

  - id: OPENAPI-016
    area: spec-property-requiredness
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Verification is a manual bb invocation. Exercised indirectly by the live suite on 10.4.2; the
      cause was not re-probed.
    description: >
      Create draft pull request comments by asking for the PENDING state, not by setting the
      read-only pending flag.
    reference:
      type: endpoint
      value: POST /api/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/comments
      upstream_issue: >
        RestComment carries both a pending boolean, marked readOnly, and a free-form state string
        whose only documented example is OPEN. Nothing in the spec says which one puts a comment into
        the draft state, and the read-only marker on pending says only that it cannot be set -- not
        what to set instead.

        Probed directly against a running instance, each on a fresh pull request:
          body pending: true          -> 201, response state OPEN, pull request review empty
          query ?draft=true           -> 201, review empty
          query ?pending=true         -> 201, review empty
          body state: "PENDING"       -> 201, comment appears in GET .../review

        The failure was silent in the worst way: bb reported "Created pending comment", and the
        comment was published to everyone on the pull request instead.

        This is a spec gap rather than a server defect, so it is recorded here rather than fixed in
        the sanitizer: the wire contract is fine once you know which field carries the state.
    change:
      files:
        - internal/services/comment/service.go
        - internal/cli/pr_review_jira_test.go
      detail: >
        Comment creation sends state PENDING when --pending is given, and nothing otherwise.

        The unit test asserted the pending flag was set, so it passed throughout. It now asserts the
        state, which is the field the server reads. A stub can only confirm that bb sent what bb
        meant to send; that the meaning was wrong needed a real server, and the pending review
        commands had no live test until now.
    verification:
      commands:
        - go test ./internal/cli/ -run TestPRCommentPending
        - go test -tags live -run TestLivePullRequestPendingReview ./tests/integration/live/

  - id: OPENAPI-017
    area: spec-property-types
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Exercised by its live test on 10.4.2. The cause was not re-probed unmitigated.
    description: >
      Declare the three ref collections on RestRefSyncStatus as arrays, which is what the server
      returns.
    reference:
      type: endpoint
      value: >
        GET and POST /sync/latest/projects/{projectKey}/repos/{repositorySlug}
      upstream_issue: >
        RestRefSyncStatus declares aheadRefs, divergedRefs and orphanedRefs as single objects. The
        server returns each as an array, so the generated model cannot decode the response:
        "json: cannot unmarshal array into Go struct field RestRefSyncStatus.aheadRefs".

        Probed directly against a running instance, on a fresh fork:
          GET while synchronization is off -> {"available":true,"enabled":false}
          POST enabling it                 -> {"available":true,"enabled":true,"lastSync":...,
                                               "aheadRefs":[],"divergedRefs":[],"orphanedRefs":[]}

        The GET omits the three fields entirely while synchronization is off, which is why only the
        call that switches it on -- the one that gets a populated body back -- failed. bb repo sync
        status and bb repo sync disable appeared to work throughout.
    change:
      files:
        - tools/openapi-sanitize/main.go
        - internal/models/generated/bitbucket_types.gen.go
        - internal/openapi/generated/bitbucket_client.gen.go
      detail: >
        The sanitizer wraps each listed property in an array schema, moving readOnly up to the array
        since it describes the field rather than its element type.

        The list is explicit rather than inferred from plural names: a plural name is a hint, and the
        rewrite is only safe where the encoding has been seen.
    verification:
      commands:
        - task models:generate
        - task client:generate
        - go test -tags live -run TestLiveRepositoryForkSync ./tests/integration/live/

  - id: OPENAPI-018
    area: spec-property-requiredness
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Exercised by its live test on 10.4.2. The cause was not re-probed unmitigated.
    description: >
      Send a ref and an action on the manual fork synchronization endpoint, both of which the server
      requires despite the schema marking them optional.
    reference:
      type: endpoint
      value: POST /sync/latest/projects/{projectKey}/repos/{repositorySlug}/synchronize
      upstream_issue: >
        RestRefSyncRequest declares refId, action and context as optional properties. The server
        requires refId and action, and answers a missing one with an unhandled exception rather than
        a validation error, so the response says nothing about what was wrong.

        Probed directly against a running instance, same fork each time:
          {}                                            -> 500 generic "An error occurred"
          {"refId":"refs/heads/master"}                 -> 500 generic
          {"action":"MERGE"}                            -> 500 generic
          {"refId":"refs/heads/master","action":"MERGE"} -> reaches the ref logic

        bb sent an empty body, so bb repo sync answered 500 for every fork in every state and had
        never worked. It was among the commands the live-coverage gate grandfathered.
    change:
      files:
        - internal/services/forksync/service.go
        - internal/cli/repo_commands.go
      detail: >
        Synchronize now takes a ref and an action, and validates both before calling, so a missing
        one is a validation error naming the flag rather than a 500 naming nothing.

        The command gained --ref and --action. --action defaults to MERGE, which is what the endpoint
        is for and what Bitbucket's own UI offers first. --ref defaults to the repository's default
        branch: a bare bb repo sync means the branch the fork exists for, and making the user repeat
        it would be ceremony given the server needs a ref either way.

        The requiredness is recorded here rather than fixed in the sanitizer. Adding the two fields
        to the schema's required list would make the generated struct carry them as non-pointers,
        which is right, but it would also describe the endpoint as one where the caller must choose a
        ref -- and the useful behaviour is bb choosing a sensible one.
    verification:
      commands:
        - go build ./...
        - go test ./internal/services/forksync/
        - go test -tags live -run TestLiveRepositoryForkSync ./tests/integration/live/

  - id: OPENAPI-019
    area: spec-response-types
    source: server-contradicts-published-spec
    status: active-not-reprobed
    status_evidence: >
      Spec side re-probed on 10.4: addKey still declares its 200 as a single RestGpgKey. Whether the
      server still answers with an array was not re-probed.
    description: >
      Declare the add-GPG-key response as an array of keys, which is what the server sends.
    reference:
      type: endpoint
      value: POST /gpg/latest/keys
      upstream_issue: >
        The 200 response is declared as a single RestGpgKey, described as "the GPG key that was just
        created". The server answers with every key the submitted block contained, as an array, so
        even the ordinary one-key case fails to decode:
        "json: cannot unmarshal array into Go value of type openapigenerated.RestGpgKey".

        Probed directly against a running instance with a one-key armored block:
          POST /gpg/latest/keys -> 200 [{"fingerprint":"04f4...","id":"55f7...","emailAddress":"...","subKeys":[]}]

        The consequence was that bb auth gpg-key add had never worked. Its unit tests passed
        throughout because both stubs -- the service one and the CLI one -- answered with a single
        object, the shape bb expected rather than the shape the server sends.
    change:
      files:
        - tools/openapi-sanitize/main.go
        - internal/services/gpgkey/service.go
        - internal/cli/cmd/auth/gpg.go
        - internal/services/gpgkey/service_test.go
        - internal/cli/cmd/auth/gpg_test.go
      detail: >
        The sanitizer gained a pass for operation responses, keyed by operationId and status, that
        wraps the declared schema in an array. It is separate from the property-level pass because a
        response schema sits under paths rather than under components.

        AddGpgKey returns every key the server reports rather than one, and the command names them
        all. There was no established output shape to preserve, since the command had never returned
        successfully.

        Both stubs now answer with an array. A stub written from the spec inherits the spec's
        mistakes, which is the whole reason this needed a live test to surface.
    verification:
      commands:
        - task models:generate
        - task client:generate
        - go test ./internal/services/gpgkey/ ./internal/cli/cmd/auth/
        - go test -tags live -run TestLiveGPGKeyLifecycle ./tests/integration/live/

  - id: OPENAPI-020
    area: spec-endpoint-semantics
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Spec side re-probed on 10.4: RestRefSyncStatus still declares aheadRefs, divergedRefs and
      orphanedRefs as single objects with no type or items, where the server sends arrays.
    description: >
      Read the current webhook before updating it, because the update endpoint replaces the webhook
      rather than patching it.
    reference:
      type: endpoint
      value: >
        PUT /api/latest/projects/{projectKey}/repos/{repositorySlug}/webhooks/{webhookId} and
        PUT /api/latest/projects/{projectKey}/webhooks/{webhookId}
      upstream_issue: >
        RestWebhook declares every property optional, which reads as a partial update. The endpoint
        replaces the stored webhook with the body it is given, so an omitted property is a cleared
        property.

        For url and events the server catches it:
          PUT {"name":"new"} -> 400 "No URL was specified", "At least one event must be provided"

        For everything else it does not. active, sslVerificationRequired and the configuration block
        carry no such validation, so a name-only update silently switched off TLS verification and
        dropped the shared secret. The loud half is what got noticed.

        This is a spec-semantics gap rather than a wire-format defect, so it is recorded here rather
        than fixed in the sanitizer: nothing about the schema is wrong, it just does not say that
        absent means cleared.
    change:
      files:
        - internal/services/reposettings/service.go
        - internal/services/project/webhook.go
      detail: >
        Both update paths read the webhook, overlay the supplied flags and send the complete object,
        so --name on its own means what its help says.

        Statistics and scopeType are dropped from the body on the way back. They describe the webhook
        rather than configure it, and echoing them invites the server to disagree with itself.

        The alternative was to validate up front and require all three flags together. Rejected
        because repo edit and pr update already accept partial changes, so update-meaning-partial is
        the established shape here -- and because it would have left the silent half of the bug
        intact, merely better documented.

        Credentials cannot be preserved this way: the password is write-only and never returned, so
        an update still clears it. That is a server limitation rather than something the merge can
        fix, and it is unchanged from the previous behaviour.
    verification:
      commands:
        - go test ./internal/services/reposettings/ ./internal/services/project/
        - go test -tags live -run "TestLiveRepositoryWebhookLifecycle|TestLiveProjectWebhookLifecycle" ./tests/integration/live/

  - id: OPENAPI-021
    area: generated-symbol-stability
    source: generator-or-language-limit
    status: active
    status_evidence: >
      The generated constant names are an artefact of oapi-codegen's collision handling; the spec is
      accurate.
    description: Insulate call sites from generated enum constant names, which are not stable across spec versions.
    reference:
      type: generation
      value: openapigenerated.GetRepositories1ParamsPermission
      upstream_issue: oapi-codegen qualifies an enum constant only once another value name collides with it
    change:
      files:
        - internal/openapi/permissions.go
      detail: >
        oapi-codegen emits a bare REPOWRITE while that value name is unique in the spec and a
        qualified GetRepositories1ParamsPermissionREPOWRITE once anything collides with it. The
        10.2 to 10.4 bump crossed that threshold and renamed all three repository permission
        constants with no change in meaning, breaking ninety-one call sites across twenty files.

        internal/openapi now exports RepoRead, RepoWrite and RepoAdmin, and everything else refers
        to those. The next rename of this kind is three lines rather than ninety-one.

        The type itself, GetRepositories1ParamsPermission, is aliased as RepositoryPermission for
        the same reason: its name records which operation the generator happened to derive the enum
        from, which is not a fact any call site should depend on.
    verification:
      commands:
        - go build ./...
        - go test ./internal/cli/... ./internal/services/...

  - id: OPENAPI-022
    area: generated-operation-repointing
    source: this-project
    status: active
    status_evidence: >
      A guard this project lacked. The instability it guards against is upstream.
    description: Detect a generated operation being re-pointed at a different endpoint by an upstream spec change.
    reference:
      type: generation
      value: docs/quality/generated-operation-paths.json
      upstream_issue: collision-suffixed operationIds are numbered in spec order, so upstream additions renumber them
    change:
      files:
        - tools/openapi-operation-paths/main.go
        - docs/quality/generated-operation-paths.json
        - Taskfile.yml
      detail: >
        OPENAPI-009 made suffix assignment deterministic for a given spec. It is still not stable
        across specs, and the cause is upstream rather than local: Atlassian's own operationIds
        re-point between releases. Eleven of them name a different endpoint in 10.4 than in 10.2,
        so preserving upstream ids verbatim instead of canonicalising would not have helped. Delete7 was the
        repository reviewer-group delete in 10.2 and something else in 10.4; Delete6 became
        Delete8. The same renumbering moved getStatus during the 10.2 bump, which is why
        forksync carries a comment naming GetStatus over GetStatus2.

        Each of those was caught only because the arity changed too and the build broke. Two
        endpoints with the same shape would have swapped silently and the CLI would have called
        the wrong URL with no signal at all.

        tools/openapi-operation-paths records the endpoint behind every generated operation this
        project calls, into a committed file. A spec bump that re-points one now shows up as a
        diff a reviewer has to accept, rather than as luck.
    verification:
      commands:
        - task openapi:operation-paths:verify

  - id: OPENAPI-023
    area: spec-version-drift
    source: this-project
    status: active
    status_evidence: >
      A process defect in this project: the spec version was pinned separately from the release under
      test.
    description: Derive the vendored OpenAPI reference from the Bitbucket release the harness runs.
    reference:
      type: generation
      value: docs/reference/atlassian/bitbucket-openapi.json
      upstream_issue: the spec version was pinned separately from the version under test and drifted two minors behind it
    change:
      files:
        - tools/openapi-spec/main.go
        - Taskfile.yml
        - .github/dependabot.yml
      detail: >
        ADR-042 records the version under test in exactly one place, the harness base image tag,
        so nothing can drift from it. The vendored spec kept a second copy of that fact in four
        Taskfile variables and in its own filename, and drifted: the harness moved to 10.4.x while
        the spec stayed at 10.2.

        tools/openapi-spec derives the API version from the image tag instead. Refresh mode
        downloads the matching spec, verify mode fails when the two have parted ways, and the
        vendored file lost the version from its name so there is nothing left to update by hand.

        Dependabot no longer ignores atlassian/bitbucket. It was held back while the test licence
        capped the provisionable version; licences are now provisioned per run for the current
        release. A bump remains a proposal that the live suite accepts or rejects, and it has to
        carry the matching task openapi:refresh.
    verification:
      commands:
        - task openapi:verify
        - task models:verify
        - task client:verify

  - id: OPENAPI-024
    area: default-reviewers-response-shape
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Observed on 10.4.2 by raw HTTP with no bb code in the path. The spec declares the 200 body as
      an array of RestPullRequestCondition; the server answers with a flat array of users.
    description: >
      GET .../default-reviewers/latest/projects/{key}/repos/{slug}/reviewers returns the resolved
      reviewers, not the conditions that produced them.
    reference:
      type: endpoint
      value: /default-reviewers/latest/projects/{projectKey}/repos/{repositorySlug}/reviewers
      upstream_issue: >
        Declared 200 schema is array of RestPullRequestCondition. The server sends
        [{"name":"user","id":3,...}] -- ApplicationUser objects with no enclosing condition.
    change:
      files:
        - internal/services/reviewer/service.go
      detail: >
        GetDefaultReviewers decodes the body itself rather than trusting the generated JSON200,
        which is typed from the same spec and therefore wrong at the source. Users are read first,
        falling back to the declared shape so a server that really does answer with conditions keeps
        working.

        The workaround sits in the service rather than the sanitizer because the generated response
        type is reachable from other operations, and narrowing it there is a larger change than the
        defect warrants. If this is repaired upstream, the fallback becomes the only path and this
        entry can go.

        Cost of the divergence: every caller read a nested reviewers field off objects that never
        had one, so `--default-reviewers` resolved to nobody on every repository. The unit test
        covering it returned the shape the spec describes, so it agreed with the code and the
        feature was never exercised against a server until the mock was migrated (ADR-079).
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestLiveDefaultReviewers

  - id: OPENAPI-025
    area: default-reviewers-parameter-requiredness
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Observed on 10.4.2 by raw HTTP. sourceRepoId and targetRepoId carry no required flag in the
      spec; omitting them answers 400, "The source repository with id '0' does not exist".
    description: >
      The repository ids on the default-reviewers lookup are mandatory in practice, though the spec
      marks them optional.
    reference:
      type: endpoint
      value: /default-reviewers/latest/projects/{projectKey}/repos/{repositorySlug}/reviewers
      upstream_issue: >
        sourceRepoId and targetRepoId have no `required: true`, and the server defaults a missing
        value to 0 and then rejects it.
    change:
      files:
        - internal/services/reviewer/service.go
        - internal/cli/cmd/pr/pr.go
      detail: >
        ResolveDefaultReviewers always sends both ids, resolving the source repository separately
        when a pull request comes from a fork. The refs, by contrast, are accepted qualified or
        bare -- the server matches refs/heads/main and main alike -- so the qualification the code
        performs is harmless rather than required.
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestLiveDefaultReviewersFromAFork

  - id: OPENAPI-026
    area: reviewer-membership-identifier
    source: server-contradicts-published-spec
    status: active
    status_evidence: >
      Observed on 10.4.2 by raw HTTP against both endpoints.
    description: >
      A reviewer or reviewer-group member is only recognised by numeric id, though the schemas
      describe objects whose name and slug are equally present.
    reference:
      type: schema
      value: RestPullRequestCondition.reviewers, RestReviewerGroup.users
      upstream_issue: >
        A reviewer given as {"name": "..."} on a default-reviewer condition is read as id -1 and
        refused with "User with ID -1 does not exist". A reviewer-group member given as {"name": ...}
        or {"slug": ...} is accepted by the request and then reported as
        "Reviewer groups must contain 1 or more reviewer(s)", which reads as though none was named.

        RestPullRequestCondition.reviewers is separately typed as an array of RestReviewerGroup
        rather than of users, so the declared schema does not describe what the endpoint accepts
        or returns either.
    change:
      files:
        - tests/integration/live/harness_test.go
      detail: >
        The live harness resolves a username to its numeric id before building either payload. No
        production code sends these shapes today -- `reviewer condition create` takes the caller's
        JSON verbatim -- so this entry records the requirement rather than a workaround. It is the
        reason `bb reviewer-group create` cannot populate a group, tracked separately.
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestLiveReviewerGroupResolutionShapes

  - id: OPENAPI-027
    area: pull-request-participant-self-review
    source: undocumented-constraint
    status: active
    status_evidence: >
      Observed on 10.4.2 by driving submit_pr_review through the MCP server as the pull
      request's own author.
    description: >
      The author of a pull request cannot set their own review status. Nothing in the schema
      says so, and the refusal is a 400 rather than a 403.
    reference:
      type: endpoint
      value: /api/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/participants/{userSlug}
      upstream_issue: >
        Approving, unapproving or requesting changes on your own pull request is refused with
        {"message": "Authors may not update their status.",
         "exceptionName": "com.atlassian.bitbucket.pull.InvalidPullRequestRoleException"}
        under status 400.

        The status is the surprise. A role the caller does not hold reads naturally as
        authorization, and 400 maps to validation, so `bb` reports exit 2 rather than exit 3.
        That is the right answer for the wrong reason -- the request is well formed -- but it
        is what the server sends, so the taxonomy follows it.
    change:
      files:
        - tests/integration/live/mcp_live_test.go
      detail: >
        No production change. The constraint is recorded because it invalidates a whole class
        of test: any review flow written against a single account passes only against a mock.
        TestLiveMCPSubmitReviewMutatesForReal creates a second licensed user, adds them as a
        reviewer and runs the MCP server as that account.
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestLiveMCPSubmitReviewMutatesForReal

  - id: OPENAPI-028
    area: pull-request-rebase-no-op
    source: undocumented-response
    status: active
    status_evidence: >
      Observed on 10.4.2 by calling the rebase endpoint directly against a branch already on
      the tip of its target.
    description: >
      Rebasing a branch that is already on top of its target answers 204 with no body. The
      spec documents only the 200, so the generated client has nowhere to put it.
    reference:
      type: endpoint
      value: /git/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/rebase
      upstream_issue: >
        Three outcomes, one of which is not in the spec:

          - nothing to replay -> 204, empty body
          - the target moved  -> 200, {"refChange": {...}} with fromHash and toHash
          - called again straight after a successful rebase -> 409
            GitRebaseException, "New changes were pushed to '<branch>' ... while the rebase
            was being performed", because the rebase's own ref update counts as the push

        Only the 200 is declared, so RebaseWithResponse leaves the payload nil on a 204 and
        the absence is indistinguishable from a malformed response.
    change:
      files:
        - internal/services/pullrequest/service.go
        - internal/cli/cmd/pr/pr.go
      detail: >
        204 is now read as the no-op it is and returns a nil result with no error. It was
        reported as "internal: unexpected empty rebase response body" at exit 1 -- telling the
        caller bb had broken, for a pull request already exactly where it was asked to be.
        `bb pr rebase` says so instead of claiming commits moved.
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestLivePRRebase

  - id: OPENAPI-029
    area: jira-issues-for-a-missing-pull-request
    source: undocumented-behaviour
    status: active
    status_evidence: >
      Observed on 10.4.2 by asking both endpoints about the same nonexistent pull request.
    description: >
      The Jira integration endpoint answers 200 with an empty array for a pull request that
      does not exist, where the pull request endpoint answers 404.
    reference:
      type: endpoint
      value: /jira/latest/projects/{projectKey}/repos/{repositorySlug}/pull-requests/{pullRequestId}/issues
      upstream_issue: >
        GET .../pull-requests/999999/issues  -> 200 []
        GET .../pull-requests/999999         -> 404 {"errors":[{"message":"Pull request 999999
                                                    does not exist in ...",
                                                    "exceptionName":"...NoSuchPullRequestException"}]}

        The empty array is indistinguishable from a pull request that exists and has no linked
        issues, which is the answer a caller will act on.
    change:
      files:
        - internal/cli/cmd/pr/pr.go
      detail: >
        `bb pr jira` confirms the pull request exists when, and only when, the issue list comes
        back empty. Empty is the sole ambiguous answer, so it is the only one that pays for the
        extra request. Without it the command reported "No Jira issues associated with pull
        request" for a pull request nobody could open.
    verification:
      commands:
        - go test -tags=live ./tests/integration/live -run TestLiveEveryServiceMapsItsFailures
