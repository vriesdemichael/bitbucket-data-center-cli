number: 34
title: Unified dry-run planning engine for server mutating commands
category: architecture
status: accepted
decision: >
  Use one planning engine for dry-run behavior across both single-command mutation flows and
  bulk workflows. Introduce a global --dry-run flag for every command that changes state,
  defaulting to stateful planning for server-mutating command handlers, with static planning
  previews retained as a compatibility and safety fallback and for commands that change only
  this machine. For bulk workflows, `bulk plan` remains the reviewed preview mechanism and
  `bulk apply` consumes reviewed plans rather than acting as its own dry-run surface.
agent_instructions: >
  Implement dry-run behavior through shared planning abstractions rather than per-command ad-hoc
  flags. Preview a command that changes this machine as well as one that changes the server;
  neither may make its change under --dry-run. Ensure dry-run output explicitly reports planning
  mode and capability signaling for each operation path.
rationale: >
  A single planning model reduces divergence between bulk and single-command mutation previews,
  improves operator trust, and keeps output behavior consistent across automation and interactive
  usage. Making stateful planning the primary implementation for server mutations improves
  preview quality, enables realistic no-side-effect validation against live Bitbucket state,
  and preserves a narrow static fallback for unsupported or future paths without redefining the
  main operator contract.
rejected_alternatives:
  - alternative: Keep dry-run command-local and independent from bulk planning
    reason: Creates semantic drift, duplicated logic, and inconsistent output contracts.
  - alternative: Static-only dry-run globally
    reason: Misses opportunities to provide stronger preflight confidence where API/state checks exist.
provenance: human
