number: 70
title: Every command is explicitly classified for dry-run, and unknown means refuse
category: architecture
status: accepted
amended_by: 96
decision: >
  internal/cli/dryrun.go classifies every command through five registries, each answering a
  different question: dryRunProfiles describes what a server mutation would do, readOnlyCommands
  names commands that change nothing on the server, clientLocalCommands names local commands that
  change nothing or honour --dry-run themselves, clientLocalMutatingCommands names commands that
  change this machine and are previewed instead of run, and dryRunRefusedCommands names commands
  for which a preview means nothing, which refuse the flag.
  A command matching none of them is classificationUnknown, and --dry-run refuses it rather than
  running it. Fail-closed is the point: an unclassified command is one nobody decided about, and
  running it is the outcome --dry-run exists to prevent.
  Two governance tests hold the registries to the command tree, so the classification cannot fall
  behind a newly added command.
agent_instructions: >
  Classify every new command in the same change that adds it. The exhaustiveness test fails
  otherwise.
  Pick the registry by what the command changes, on the server or on this machine, not by what its
  name suggests. A command that writes anything locally belongs in clientLocalMutatingCommands
  unless it honours --dry-run itself. Where the name and the classification genuinely disagree, add
  an exemption with a reason rather than reclassifying to satisfy the check.
  Do not make unknown default to anything. A default is a decision nobody made.
rationale: >
  The classification was once inferred from the command's verb. That fails one-directionally -- it
  permits what it does not recognise -- and this CLI is full of names it could never have caught:
  merge, decline, rebase, fork, sync, watch.
  The verb still earns its keep as a cross-check rather than as the source. The name is chosen by
  whoever adds the command and derived from nothing, so it can disagree with the classification, and
  it found a real ambiguity on its first run: resolve writes in one command and reads in another.
  Read-only and client-local stay separate although the interceptor runs both, because the verb
  check only objects to a mutating verb in readOnlyCommands. That is what lets update, which honours
  --dry-run itself, keep its name without an exemption.
rejected_alternatives:
  - alternative: Keep inferring the classification from the verb
    reason: Fails open on every name it does not recognise, which is most of them.
  - alternative: Derive it from the HTTP method each handler reaches
    reason: >
      Deriving is the preference (ADR-067), but the handler is not reachable statically, and it
      would make the verb cross-check a tautology.
  - alternative: Default unknown to read-only, or to a generic preview
    reason: >
      The first runs commands nobody classified. The second prints an intent it invented, which is
      worse than refusing.
provenance: guided-ai
