number: 52
title: Layer-boundary testing policy and HTTP mock elimination
category: development
status: accepted
decision: >
  Define strict testing boundaries per layer:
  1. Unit tests must only test fast, deterministic logic (parameter translation, CLI flag mutual
  exclusion, syntax parsing, output envelopes, error taxonomy mapping, client-side pagination
  algorithms, and dry-run prediction state machines).
  2. Eliminate the class of hand-rolled httptest.Server mock tests that simulate happy-path Bitbucket
  API responses merely to echo canned payloads through 1-to-1 pass-through service methods.
  3. Client-side algorithms (such as multi-page stream filtering or version auto-resolution) must be
  tested as pure unit functions or lightweight fixture tests, decoupled from heavy in-process HTTP
  servers wherever possible.
  4. Live integration tests against the SDK-licensed Bitbucket container stack are the sole source of
  truth for Bitbucket REST API contracts, Git wire transports (HTTP/SSH), permission checks,
  auto-merge workflows, and real server behavior.
agent_instructions: >
  Do not write mock HTTP servers that pretend to be Bitbucket Server in unit tests for 1-to-1
  pass-through methods.
  Unit tests in internal/cli/cmd/ and internal/services/ should verify flag validation, required
  arguments, conflicting options, formatting (--json vs human), and domain error mapping.
  When client-side logic exists (e.g. stream filtering, page traversal, version resolution), test
  the algorithm directly with in-memory data structures rather than spinning up TCP mock listeners.
  When a feature needs verification against the Bitbucket REST API or Git transport, add a live test
  in tests/integration/live/.
  Never pad coverage with mock tests that assert tautological return values from hardcoded mock
  handlers.
rationale: >
  AI-generated test suites frequently introduce mock mirroring: spinning up an in-process HTTP mock,
  returning canned JSON, and asserting that the function returned the struct matching that JSON.
  This produces nominal 85%+ coverage while providing zero real assurance of Bitbucket compatibility,
  and creates immense refactoring drag when internal structures evolve.
  Enforcing layer boundaries eliminates test bloat, speeds up test execution, and ensures test
  efforts focus on genuine behavioral guarantees.
rejected_alternatives:
  - alternative: Rely exclusively on mock-heavy unit tests to satisfy coverage metrics
    reason: >
      Mock mirroring tests implementation details rather than real API behavior and introduces high
      maintenance friction on refactoring without catching real Bitbucket bugs.
  - alternative: Move all testing exclusively into live integration tests
    reason: >
      Running all combinatorial flag validation in live tests would dramatically slow down the live
      test suite (which already takes ~8 minutes) and degrade local developer feedback loops.
provenance: human-ai-alignment
