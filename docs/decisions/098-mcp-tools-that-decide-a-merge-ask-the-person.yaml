number: 98
title: MCP tools that decide a merge ask the person through the client
category: architecture
status: accepted
amends:
  - 39
  - 61
  - 62
decision: >
  Every MCP tool is exposed. A tool that merges, changes whether or when a pull request merges, or
  feeds a check that decides whether one may asks the person to confirm each call in the MCP client
  before it runs, and so does create_tag. update_pull_request asks only for a call that sets the
  draft flag. The confirmation is an elicitation with one required, unticked checkbox naming the
  target, and the tool acts only on an accept. A client that cannot show one gets
  -32021 MissingRequiredClientCapability, whatever revision it speaks.

  An answer accepts only the call it was asked about: the request state is signed, and holds the
  tool, a digest of the scoped arguments, an expiry, and a nonce used once. A merge and an
  auto-merge are held to the pull request version the person was shown.

  --read-only exposes only the tools annotated read-only. --yolo and --allow-writes do nothing.

  Annotations say what the specification defines them to say, whether or not a tool asks. Every tool
  declares all four hints and a title, and openWorldHint is false: one configured Data Center
  instance is a closed domain.

  The audit record adds confirmation: accepted, declined, cancelled or unavailable. A call the
  confirmation stops is status denied, and one decision is one record.
agent_instructions: >
  Declare a tool that decides a merge with askingSpec, and every other tool with toolSpec;
  TestToolsThatAskAreTheOnesThatDecideAMerge holds the set. Annotate it with readOnly or writes, and
  set each hint by its definition, never by whether the tool asks.
  Build a confirmation from the arguments, reading Bitbucket only for what the person must see and
  the call does not carry. Quote text other people wrote, and put no link in it.
  Never skip a confirmation for a client, and never make tools/list depend on what a client can do.
  If bb serves Bitbucket Cloud, set openWorldHint true on the tools that read or publish content there.
rationale: >
  A withheld tool fails without saying why, and a flag that exposes it runs it with nobody asked.
  MCP carries the person's decision itself. If you cannot trust a harness with the annotations
  and the confirmations, do not make changes in Bitbucket through it: run it read-only and make them
  yourself.
  The confirmation is in the handler, one wrapper applied to every tool that asks, because go-sdk's
  bridge for handshake-era clients sits below the middleware and never sees an input request the
  middleware returns. The specification treats a request state as written by an attacker, hence the
  signature. A form with no field is accepted by clients that approve on their own, hence the checkbox.
rejected_alternatives:
  - alternative: Keep --yolo as the override for a client that cannot ask
    reason: It makes the change with nobody asked. A client that cannot confirm a change should not be making it.
  - alternative: Withhold the tools that ask from a client that cannot elicit
    reason: tools/list must not vary per connection, and a tool that is missing fails without saying why.
  - alternative: A tool error instead of -32021 for clients on older revisions
    reason: Two answers to one refusal. The code the current revision defines says what is missing.
  - alternative: Derive destructiveHint from whether a tool asks
    reason: It would call create_tag destructive, though it only adds, and update_pull_request additive, though it overwrites.
  - alternative: Confirm by typing the pull request reference
    reason: Merging is routine and no tool deletes anything. Typing is for a tool that removes what cannot be restored.
provenance: guided-ai
