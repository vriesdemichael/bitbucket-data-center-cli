number: 94
title: MCP tool results are what a model can use without files or a shell
category: architecture
status: accepted
decision: >
  An MCP tool answers a client that may be a chat app speaking MCP and nothing else: no file
  system, no shell, no bb. What the model needs arrives as text or as an image, the two kinds of
  content every such client shows it, converted on the server; audio, or a video in an embedded
  resource, may come as well, as an extra a client can ignore. A result never points the model at
  a command, a local path, a download or a link it cannot follow. It may give a page in Bitbucket
  for the person the model is talking to.
  get_file_content is the case in point. Text comes back in numbered windows the model pages
  through, Word, PowerPoint and Excel files as their extracted text, archives as a listing, images
  as images scaled to what clients take, with a note when they were scaled, and anything else as a
  description of what it is and how large.
agent_instructions: >
  Put what a model needs into text or image content, converted in the server, and bound every
  answer with a window, a cap or a scale. What cannot be converted is described: what it is, how
  large, and its page in Bitbucket for a person to open. Never tell the model to run bb or any
  other command, to read a path, or to download something, and do not answer with resource links
  or templates. Convert with the standard library and golang.org/x/image; a new converter
  dependency is for the owner to agree to.
rationale: >
  A model in a chat client can use only what the client shows it. A command it cannot run, a path
  it cannot open and a link the client renders as text are dead ends that read like answers. The
  server holds the bytes and can convert them, so every client gets the same usable answer.
rejected_alternatives:
  - alternative: Return a file's bytes as text
    reason: A binary file came back corrupted, and a large one filled the context in one piece.
  - alternative: Point the model at bb repo cat for a file the tool cannot show
    reason: The client may have no shell and no bb, which leaves the model an instruction it cannot follow.
  - alternative: Resource links and resource templates
    reason: Most clients show a link to the model as text and never read it.
  - alternative: A PDF library to extract a PDF's text
    reason: Declined; a PDF is described, with its page in Bitbucket for a person to open.
provenance: guided-ai
