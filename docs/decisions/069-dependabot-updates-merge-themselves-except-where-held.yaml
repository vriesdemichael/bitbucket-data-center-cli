number: 69
title: Dependabot updates merge themselves, except where held for a person
category: development
status: accepted
decision: >
  Dependabot proposes dependency updates and .github/workflows/dependabot-automerge.yml approves and
  rebase-merges them once CI is green. This is deliberate: a green run is accepted as sufficient
  evidence that an update is safe, without a human reading the diff.
  Three things are held for a person instead: major version bumps, any update whose type will not
  parse, and the Bitbucket product image whatever its update type, because the tag under test is a
  user-facing support claim (ADR-042).
  Every GitHub Action is pinned to the full commit of a release, with the release named in a comment
  beside it. A tag can be moved by whoever owns it, and the release workflow runs with a token that
  publishes signed binaries; a commit cannot be moved. Dependabot reads the comment and proposes the
  next release as a new commit, so a pinned action stays in the automated stream.
  Ecosystems, schedules, grouping and the held set live in .github/dependabot.yml and the workflow.
  This record does not restate them.
agent_instructions: >
  Do not add a dependency exception to this record; add it to the workflow, where it is executable.
  Do not weaken a CI gate to get an update through. The gate is what auto-merge is trusting.
  Pin a new action the same way, as owner/action@<full commit> # vX.Y.Z, where the commit is the one
  the release tag points to (follow an annotated tag to its commit). TestEveryActionIsPinnedToACommit
  fails on a tag, a short sha, or a commit with no release named beside it.
rationale: >
  Auto-merge is only defensible where the gate is. Every pull request here runs the live suite
  against a real Bitbucket (ADR-043) and must clear the coverage gates (ADR-065), so a green run
  exercises the dependency rather than merely compiling against it. Reading the diff of a patch bump
  adds little to that, and doing it for every proposal adds enough friction that updates accumulate,
  which is the outcome the policy exists to avoid.
  The held set is where a green run is not the whole question. A major bump can be green and still
  change behaviour a reader should see, and the product image tag is a claim about what this project
  supports rather than a dependency of its build.
rejected_alternatives:
  - alternative: Review every dependency update by hand
    reason: >
      Updates accumulate and land in batches, which is when they break. The gate already exercises
      them against a real server.
  - alternative: Auto-merge majors too
    reason: A green run does not answer whether a behaviour change should be adopted.
provenance: guided-ai
