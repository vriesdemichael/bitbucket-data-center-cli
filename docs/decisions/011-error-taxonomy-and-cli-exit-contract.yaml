number: 11
title: Error taxonomy and CLI exit contract
category: architecture
status: accepted
decision: >
  Define a stable error taxonomy and map it to deterministic CLI exit codes and structured JSON
  error payloads. The kinds are authentication, authorization, validation, not_found, conflict,
  transient, permanent, not_implemented, cancelled, unknown_outcome and internal; internal is what
  an unclassified error becomes, so every error has a kind.

  unknown_outcome is exit 13 and means the request was sent and its result never came back, so bb
  cannot say whether the server applied it. It sits apart from transient, which invites a retry,
  and from permanent, which says the work did not happen: a mutation that timed out may well have
  been applied, and the honest answer is that it has to be checked rather than repeated.
agent_instructions: >
  Map transport and service errors into canonical categories before returning from workflows.
  Do not report a failed mutation as transient when its outcome is unknown: exit 10 tells a
  caller's wrapper to replay a request the retry policy itself refuses to replay.
  Keep human output and JSON output consistent with the same underlying error classification.
  Avoid leaking raw upstream errors directly to users.
rationale: >
  Deterministic error behavior is required for both scriptability and operator trust.
  A consistent taxonomy simplifies retries, diagnostics, and support workflows.
rejected_alternatives:
  - alternative: Free-form error strings and ad-hoc exit codes
    reason: Breaks machine consumption and makes behavior unpredictable.
provenance: guided-ai
