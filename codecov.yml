codecov:
  require_ci_to_pass: true

# Go coverprofiles record import paths, so the module prefix has to come off
# before Codecov can match a path to a file in the repository. Stripping it
# explicitly rather than relying on name-based heuristics is what this is for:
# those heuristics stopped matching when the repository was renamed, and the
# reports were discarded silently for two months before anyone noticed.
fixes:
  - "github.com/vriesdemichael/bitbucket-data-center-cli/::"

component_management:
  individual_components:
    - component_id: internal_api
      name: internal-api
      flag_regexes:
        - ^combined_scoped$
      paths:
        - internal/**

    - component_id: cmd
      name: cmd
      flag_regexes:
        - ^combined_scoped$
      paths:
        - cmd/**

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        flags:
          - combined_scoped
        paths:
          - cmd/**
          - internal/**
          - "!internal/openapi/generated/**"
          - "!internal/models/generated/**"
        target: auto
    patch:
      default:
        flags:
          - combined_scoped
        paths:
          - cmd/**
          - internal/**
          - "!internal/openapi/generated/**"
          - "!internal/models/generated/**"
        target: auto

ignore:
  - docs/**
  - docker/**
  - tests/**
  - internal/openapi/generated/**
  - internal/models/generated/**
