codecov:
  require_ci_to_pass: true

# Go coverprofiles record import paths, and the module path is still
# github.com/vriesdemichael/bitbucket-server-cli even though the repository was
# renamed to bitbucket-data-center-cli.  Strip the prefix explicitly instead of
# relying on Codecov's name-based path heuristics, which stopped matching at the
# rename.
fixes:
  - "github.com/vriesdemichael/bitbucket-server-cli/::"

component_management:
  individual_components:
    - component_id: internal_api
      name: internal-api
      flag_regexes:
        - ^combined_scoped$
      paths:
        - internal/**

    - component_id: cmd
      name: cmd
      flag_regexes:
        - ^combined_scoped$
      paths:
        - cmd/**

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        flags:
          - combined_scoped
        paths:
          - cmd/**
          - internal/**
          - "!internal/openapi/generated/**"
          - "!internal/models/generated/**"
        target: auto
    patch:
      default:
        flags:
          - combined_scoped
        paths:
          - cmd/**
          - internal/**
          - "!internal/openapi/generated/**"
          - "!internal/models/generated/**"
        target: auto

ignore:
  - docs/**
  - docker/**
  - tests/**
  - internal/openapi/generated/**
  - internal/models/generated/**
