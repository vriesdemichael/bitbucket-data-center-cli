name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version tag override (for example v0.1.0)
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compute.outputs.should_release }}
      version: ${{ steps.compute.outputs.version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release source ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must run from refs/heads/main so the signing identity stays stable."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute release version from Conventional Commits
        id: compute
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          # The tag list decides the version, and a checkout that started while
          # another release was still running has a stale one. Refreshing here
          # is what lets the supersede check inside see a tag the other run
          # pushed a moment ago (#499).
          git fetch --tags --force origin

          # Which commits release, and what counts as breaking, live in
          # tools/conventionalcommits -- the same package the release-flow gate
          # reads to refuse a breaking change on a pull request into main. Two
          # copies could disagree, and the disagreement that matters is the gate
          # allowing something in that this then cuts a major release from
          # (ADR-065).
          go run ./tools/release-version

  # Every platform's archives, the Linux packages, and each binary's SBOM,
  # checked against the archive it describes. ci.yml runs the same workflow on
  # every pull request.
  build-artifacts:
    name: Build artifacts
    needs:
      - determine-version
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}

  # A published SBOM answers "give us an SBOM". An SBOM *attestation* answers
  # "prove this SBOM describes that artifact", which is the question a
  # supply-chain scanner actually asks, and it is verifiable with the same
  # `gh attestation verify` the provenance already uses.
  #
  # Each archive is attested with the SBOM of the binary inside it, and the
  # .deb and .rpm with the SBOM of the hardened binary they install. The job
  # runs nothing but the download and the attestation, because any job in this
  # workflow that can mint an OIDC token can sign as release.yml on main -- the
  # identity `bb update` trusts -- and the build runs third-party tools.
  # Its platforms are the build's (TestEveryReleasedPlatformHasItsSBOMsAttested).
  attest-sboms:
    name: Attest ${{ matrix.goos }}/${{ matrix.goarch }} SBOMs
    needs:
      - determine-version
      - build-artifacts
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - name: Download the platform's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist

      - name: Name the platform's artifacts
        id: names
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          PLATFORM: ${{ matrix.goos }}_${{ matrix.goarch }}
        run: echo "base=dist/bb_${VERSION#v}_${PLATFORM}" >> "$GITHUB_OUTPUT"

      # actions/attest, not actions/attest-sbom: the latter is deprecated and is
      # a warning followed by this same action at this same version, so twelve
      # warnings per release bought nothing.
      - name: Attest the standard archive with its SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.names.outputs.base }}.${{ matrix.archive }}
          sbom-path: ${{ steps.names.outputs.base }}.spdx.json

      # Only the Linux build has a .deb and an .rpm; elsewhere those two paths
      # match nothing and the archive is the one subject.
      - name: Attest the hardened archive and packages with their SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ steps.names.outputs.base }}_noupdate.${{ matrix.archive }}
            ${{ steps.names.outputs.base }}.deb
            ${{ steps.names.outputs.base }}.rpm
          sbom-path: ${{ steps.names.outputs.base }}_noupdate.spdx.json

  release:
    name: Publish Release
    needs:
      - determine-version
      - build-artifacts
      - attest-sboms
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate version input
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like vMAJOR.MINOR.PATCH (optionally with prerelease/build suffix)."
            exit 1
          fi

      - name: Generate changelog from Conventional Commits
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.determine-version.outputs.previous_tag }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Reads the same classification the version above was computed from,
          # so the notes and the number they belong to cannot disagree about
          # which commits break things (ADR-065). Writes RELEASE_NOTES.md, which
          # becomes the release body and the versioned docs snapshot, and
          # changelog.json, which ships as a release asset.
          go run ./tools/release-notes

      - name: Create and push annotated tag
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ask the remote rather than the tag list this job started with: the
          # question is whether the tag exists now, not whether it existed at
          # checkout.
          git fetch --tags --force origin

          if ! git rev-parse --verify --quiet "$VERSION" >/dev/null; then
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            exit 0
          fi

          tagged=$(git rev-list -n 1 "$VERSION")
          if [[ "$tagged" == "$GITHUB_SHA" ]]; then
            echo "Tag $VERSION is already on this commit; nothing to push."
            exit 0
          fi

          # Somebody else published this version, from a different commit. This
          # run is stale: its artifacts were built from $GITHUB_SHA and would be
          # published under a tag that does not point at them. Nothing is lost
          # by stopping -- the next release computes from the last tag and
          # sweeps these commits up with it.
          echo "Tag $VERSION already points at $tagged, not $GITHUB_SHA."
          echo "Another release published this version first; this run is superseded."
          exit 1

      # Every download asset carries the version in its filename, so a reader has
      # to know the version before they can build a URL -- which is why the
      # install instructions used to pin one, and why the pin went stale.
      #
      # Each one also gets a copy without the version, so
      # /releases/latest/download/bb_linux_amd64.deb resolves for anyone who just
      # wants the current release. The versioned names stay exactly as they were:
      # Homebrew, WinGet and Scoop all reference them, as does anyone
      # pinning a release.
      #
      # Created before the checksum step on purpose, so both names appear in
      # sha256sums.txt and `sha256sum -c --ignore-missing` verifies whichever the
      # reader downloaded. The signing step's globs pick the copies up too.
      - name: Add version-less asset aliases
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          version_no_v="${VERSION#v}"
          for file in dist/bb_"${version_no_v}"_*; do
            [[ -f "$file" ]] || continue
            alias_name="${file/_${version_no_v}_/_}"
            if [[ "$alias_name" == "$file" ]]; then
              echo "refusing to alias $file: version segment not found" >&2
              exit 1
            fi
            cp -- "$file" "$alias_name"
          done
          ls -1 dist/

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt
          )

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with Sigstore bundles
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for file in dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.spdx.json dist/sha256sums.txt; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${file}.sigstore.json" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file" >/dev/null
          done

      - name: Generate GitHub provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "$VERSION" dist/* changelog.json --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md dist/* changelog.json
          fi

  publish-docs:
    name: Publish Docs
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    # contents: write, and nothing else. These two steps were the last of the
    # release job, which holds id-token: write and attestations: write -- the
    # permissions that mint the Sigstore identity bb update trusts,
    # release.yml@refs/heads/main. Publishing the docs installs thirty-seven
    # PyPI packages, runs mkdocs-macros over this repository's own Python, and
    # builds task from source, so any one of them ran a step away from signing
    # a release. Separating them costs a checkout.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      # After the release above, because it reads the releases API for the
      # release it is about to describe.
      - name: Render changelog for published docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate > .tmp/releases.json
          python scripts/render_docs_changelog.py --releases-json .tmp/releases.json --releases-page-url "https://github.com/${GITHUB_REPOSITORY}/releases" --output docs/site/changelog.md

      - name: Publish versioned docs to GitHub Pages branch
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          task docs:deploy-version VERSION="$VERSION"

  winget-release:
    name: Publish to WinGet
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync WinGet fork with upstream
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/vriesdemichael/winget-pkgs/merge-upstream \
            -f branch=master

      - name: Verify WinGet fork is current
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          upstream_sha=$(gh api /repos/microsoft/winget-pkgs/branches/master --jq '.commit.sha')
          fork_sha=$(gh api /repos/vriesdemichael/winget-pkgs/branches/master --jq '.commit.sha')

          if [[ "$fork_sha" != "$upstream_sha" ]]; then
            echo "WinGet fork master does not exactly match upstream master after merge-upstream."
            echo "upstream master: $upstream_sha"
            echo "fork master:     $fork_sha"
            exit 1
          fi

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: vriesdemichael.bb
          release-tag: ${{ needs.determine-version.outputs.version }}
          installers-regex: '^bb_.*_windows_(amd64|arm64)_noupdate\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  scoop-release:
    name: Publish to Scoop
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Download checksums from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "sha256sums.txt" \
            --output sha256sums.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Update Scoop bucket manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          export VERSION_NO_V="${VERSION#v}"
          export HASH_AMD64
          HASH_AMD64=$(grep "bb_${VERSION_NO_V}_windows_amd64_noupdate.zip" sha256sums.txt | awk '{print $1}')
          export HASH_ARM64
          HASH_ARM64=$(grep "bb_${VERSION_NO_V}_windows_arm64_noupdate.zip" sha256sums.txt | awk '{print $1}')
          export BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

          git clone https://github.com/vriesdemichael/scoop.git scoop-bucket
          cd scoop-bucket
          git config credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "${SCOOP_BUCKET_TOKEN}"; }; f'

          python - <<'PY'
          import json, os
          version_no_v = os.environ["VERSION_NO_V"]
          hash_amd64   = os.environ["HASH_AMD64"]
          hash_arm64   = os.environ["HASH_ARM64"]
          base_url     = os.environ["BASE_URL"]
          repo_url     = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          manifest = {
              "version": version_no_v,
              "description": "A CLI for Bitbucket Server / Bitbucket Data Center",
              "homepage": repo_url,
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": f"{base_url}/bb_{version_no_v}_windows_amd64_noupdate.zip",
                      "hash": hash_amd64,
                  },
                  "arm64": {
                      "url": f"{base_url}/bb_{version_no_v}_windows_arm64_noupdate.zip",
                      "hash": hash_arm64,
                  },
              },
              "bin": "bb.exe",
              "checkver": {"github": repo_url},
              "autoupdate": {
                  "architecture": {
                      "64bit": {"url": f"{repo_url}/releases/download/v$version/bb_$version_windows_amd64_noupdate.zip"},
                      "arm64": {"url": f"{repo_url}/releases/download/v$version/bb_$version_windows_arm64_noupdate.zip"},
                  },
              },
          }
          with open("bb.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bb.json
          git diff --cached --quiet || git commit -m "Update bb to ${VERSION}"
          git push

  homebrew-release:
    name: Publish to Homebrew tap
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Download checksums from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "sha256sums.txt" \
            --output sha256sums.txt

      - name: Update Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone https://github.com/vriesdemichael/homebrew-tap.git tap

          python scripts/gen_homebrew_formula.py \
            --version "${VERSION#v}" \
            --repository "$GITHUB_REPOSITORY" \
            --sha256sums sha256sums.txt \
            --output tap/Formula/bb.rb

          cd tap
          git config credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "${TAP_GITHUB_TOKEN}"; }; f'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bb.rb
          git diff --cached --quiet || git commit -m "Update bb to ${VERSION}"
          git push
