name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version tag override (for example v0.1.0)
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compute.outputs.should_release }}
      version: ${{ steps.compute.outputs.version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release source ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must run from refs/heads/main so the signing identity stays stable."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute release version from Conventional Commits
        id: compute
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          # The tag list decides the version, and a checkout that started while
          # another release was still running has a stale one. Refreshing here
          # is what lets the supersede check inside see a tag the other run
          # pushed a moment ago (#499).
          git fetch --tags --force origin

          # Which commits release, and what counts as breaking, live in
          # tools/conventionalcommits -- the same package the release-flow gate
          # reads to refuse a breaking change on a pull request into main. Two
          # copies could disagree, and the disagreement that matters is the gate
          # allowing something in that this then cuts a major release from
          # (ADR-065).
          go run ./tools/release-version

  build-artifacts:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} artifact
    needs:
      - determine-version
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_ext: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_ext: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary_ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            binary_ext: .exe
          - goos: windows
            goarch: arm64
            archive: zip
            binary_ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      - name: Validate version input
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like vMAJOR.MINOR.PATCH (optionally with prerelease/build suffix)."
            exit 1
          fi

      - name: Embed Windows PE metadata
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          go install github.com/tc-hib/go-winres@v0.3.3
          VERSION_NO_V="${VERSION#v}"
          # PE version must be X.Y.Z.W (four numeric components)
          PE_VERSION="${VERSION_NO_V}.0"
          YEAR="$(date -u +%Y)"
          go-winres simply \
            --arch amd64,arm64 \
            --out cmd/bb/rsrc \
            --manifest cli \
            --file-description "Bitbucket Server CLI" \
            --product-name "Bitbucket Server CLI" \
            --file-version "${PE_VERSION}" \
            --product-version "${PE_VERSION}" \
            --copyright "Copyright ${YEAR} Michael de Vries" \
            --original-filename "bb.exe"

      - name: Build and package artifact
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION_NO_V="${VERSION#v}"
          BINARY_NAME="bb${BINARY_EXT}"
          ARCHIVE_BASENAME="bb_${VERSION_NO_V}_${GOOS}_${GOARCH}"

          # Standard build (in-place self-update enabled for standalone binary downloads)
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -buildid= -X main.Version=${VERSION}" -o "$BINARY_NAME" ./cmd/bb

          if [[ "$ARCHIVE" == "zip" ]]; then
            ARCHIVE_NAME="${ARCHIVE_BASENAME}.zip"
            zip -q "dist/${ARCHIVE_NAME}" "$BINARY_NAME"
          else
            ARCHIVE_NAME="${ARCHIVE_BASENAME}.tar.gz"
            tar -czf "dist/${ARCHIVE_NAME}" "$BINARY_NAME"
          fi

          # Hardened build (in-place self-update disabled for package managers and enterprise deployments)
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -tags no_self_update -ldflags "-s -w -buildid= -X main.Version=${VERSION}" -o "$BINARY_NAME" ./cmd/bb

          if [[ "$ARCHIVE" == "zip" ]]; then
            ARCHIVE_NAME="${ARCHIVE_BASENAME}_noupdate.zip"
            zip -q "dist/${ARCHIVE_NAME}" "$BINARY_NAME"
          else
            ARCHIVE_NAME="${ARCHIVE_BASENAME}_noupdate.tar.gz"
            tar -czf "dist/${ARCHIVE_NAME}" "$BINARY_NAME"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs:
      - determine-version
      - build-artifacts
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate version input
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like vMAJOR.MINOR.PATCH (optionally with prerelease/build suffix)."
            exit 1
          fi

      - name: Generate changelog from Conventional Commits
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.determine-version.outputs.previous_tag }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Reads the same classification the version above was computed from,
          # so the notes and the number they belong to cannot disagree about
          # which commits break things (ADR-065). Writes RELEASE_NOTES.md, which
          # becomes the release body and the versioned docs snapshot, and
          # changelog.json, which ships as a release asset.
          go run ./tools/release-notes

      - name: Create and push annotated tag
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ask the remote rather than the tag list this job started with: the
          # question is whether the tag exists now, not whether it existed at
          # checkout.
          git fetch --tags --force origin

          if ! git rev-parse --verify --quiet "$VERSION" >/dev/null; then
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            exit 0
          fi

          tagged=$(git rev-list -n 1 "$VERSION")
          if [[ "$tagged" == "$GITHUB_SHA" ]]; then
            echo "Tag $VERSION is already on this commit; nothing to push."
            exit 0
          fi

          # Somebody else published this version, from a different commit. This
          # run is stale: its artifacts were built from $GITHUB_SHA and would be
          # published under a tag that does not point at them. Nothing is lost
          # by stopping -- the next release computes from the last tag and
          # sweeps these commits up with it.
          echo "Tag $VERSION already points at $tagged, not $GITHUB_SHA."
          echo "Another release published this version first; this run is superseded."
          exit 1

      - name: Build Linux .deb and .rpm packages
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

          VERSION_NO_V="${VERSION#v}"
          workdir="$(mktemp -d)"

          for arch in amd64 arm64; do
            extract="${workdir}/${arch}"
            mkdir -p "$extract"
            tar -xzf "dist/bb_${VERSION_NO_V}_linux_${arch}_noupdate.tar.gz" -C "$extract"

            for packager in deb rpm; do
              PKG_ARCH="$arch" \
              PKG_VERSION="$VERSION_NO_V" \
              PKG_BINARY="${extract}/bb" \
                nfpm package \
                  --config scripts/nfpm.yaml \
                  --packager "$packager" \
                  --target "dist/bb_${VERSION_NO_V}_linux_${arch}.${packager}"
            done
          done

          ls -1 dist/*.deb dist/*.rpm

      # Before the checksum step on purpose, so the SBOM is covered by
      # sha256sums.txt and signed like every other artifact rather than being a
      # loose file nobody can verify.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          # This workflow publishes the release itself, further down.
          upload-artifact: false
          upload-release-assets: false

      # Every download asset carries the version in its filename, so a reader has
      # to know the version before they can build a URL -- which is why the
      # install instructions used to pin one, and why the pin went stale.
      #
      # Each one also gets a copy without the version, so
      # /releases/latest/download/bb_linux_amd64.deb resolves for anyone who just
      # wants the current release. The versioned names stay exactly as they were:
      # Homebrew, WinGet and Scoop all reference them, as does anyone
      # pinning a release.
      #
      # Created before the checksum step on purpose, so both names appear in
      # sha256sums.txt and `sha256sum -c --ignore-missing` verifies whichever the
      # reader downloaded. The signing step's globs pick the copies up too.
      - name: Add version-less asset aliases
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          version_no_v="${VERSION#v}"
          for file in dist/bb_"${version_no_v}"_*; do
            [[ -f "$file" ]] || continue
            alias_name="${file/_${version_no_v}_/_}"
            if [[ "$alias_name" == "$file" ]]; then
              echo "refusing to alias $file: version segment not found" >&2
              exit 1
            fi
            cp -- "$file" "$alias_name"
          done
          ls -1 dist/

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt
          )

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifacts with Sigstore bundles
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for file in dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/sha256sums.txt dist/sbom.spdx.json; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${file}.sigstore.json" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file" >/dev/null
          done

      - name: Generate GitHub provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm

      # A published SBOM file answers "give us an SBOM". An SBOM *attestation*
      # answers "prove this SBOM describes that binary", which is the question a
      # supply-chain scanner actually asks, and it is verifiable with the same
      # `gh attestation verify` the provenance already uses.
      #
      # One SBOM covers every artifact because they are all built from the same
      # module at the same commit; the dependency set does not vary by platform.
      - name: Attest the SBOM against the released artifacts
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          sbom-path: dist/sbom.spdx.json

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "$VERSION" dist/* changelog.json --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md dist/* changelog.json
          fi

      - name: Render changelog for published docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate > .tmp/releases.json
          python scripts/render_docs_changelog.py --releases-json .tmp/releases.json --releases-page-url "https://github.com/${GITHUB_REPOSITORY}/releases" --output docs/site/changelog.md

      - name: Publish versioned docs to GitHub Pages branch
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          task docs:deploy-version VERSION="$VERSION"

  winget-release:
    name: Publish to WinGet
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync WinGet fork with upstream
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/vriesdemichael/winget-pkgs/merge-upstream \
            -f branch=master

      - name: Verify WinGet fork is current
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          upstream_sha=$(gh api /repos/microsoft/winget-pkgs/branches/master --jq '.commit.sha')
          fork_sha=$(gh api /repos/vriesdemichael/winget-pkgs/branches/master --jq '.commit.sha')

          if [[ "$fork_sha" != "$upstream_sha" ]]; then
            echo "WinGet fork master does not exactly match upstream master after merge-upstream."
            echo "upstream master: $upstream_sha"
            echo "fork master:     $fork_sha"
            exit 1
          fi

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: vriesdemichael.bb
          release-tag: ${{ needs.determine-version.outputs.version }}
          installers-regex: '^bb_.*_windows_(amd64|arm64)_noupdate\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  scoop-release:
    name: Publish to Scoop
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Download checksums from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "sha256sums.txt" \
            --output sha256sums.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update Scoop bucket manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          export VERSION_NO_V="${VERSION#v}"
          export HASH_AMD64
          HASH_AMD64=$(grep "bb_${VERSION_NO_V}_windows_amd64_noupdate.zip" sha256sums.txt | awk '{print $1}')
          export HASH_ARM64
          HASH_ARM64=$(grep "bb_${VERSION_NO_V}_windows_arm64_noupdate.zip" sha256sums.txt | awk '{print $1}')
          export BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

          git clone https://github.com/vriesdemichael/scoop.git scoop-bucket
          cd scoop-bucket
          git config credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "${SCOOP_BUCKET_TOKEN}"; }; f'

          python - <<'PY'
          import json, os
          version_no_v = os.environ["VERSION_NO_V"]
          hash_amd64   = os.environ["HASH_AMD64"]
          hash_arm64   = os.environ["HASH_ARM64"]
          base_url     = os.environ["BASE_URL"]
          repo_url     = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          manifest = {
              "version": version_no_v,
              "description": "A CLI for Bitbucket Server / Bitbucket Data Center",
              "homepage": repo_url,
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": f"{base_url}/bb_{version_no_v}_windows_amd64_noupdate.zip",
                      "hash": hash_amd64,
                  },
                  "arm64": {
                      "url": f"{base_url}/bb_{version_no_v}_windows_arm64_noupdate.zip",
                      "hash": hash_arm64,
                  },
              },
              "bin": "bb.exe",
              "checkver": {"github": repo_url},
              "autoupdate": {
                  "architecture": {
                      "64bit": {"url": f"{repo_url}/releases/download/v$version/bb_$version_windows_amd64_noupdate.zip"},
                      "arm64": {"url": f"{repo_url}/releases/download/v$version/bb_$version_windows_arm64_noupdate.zip"},
                  },
              },
          }
          with open("bb.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bb.json
          git diff --cached --quiet || git commit -m "Update bb to ${VERSION}"
          git push

  homebrew-release:
    name: Publish to Homebrew tap
    needs:
      - determine-version
      - release
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download checksums from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "sha256sums.txt" \
            --output sha256sums.txt

      - name: Update Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone https://github.com/vriesdemichael/homebrew-tap.git tap

          python scripts/gen_homebrew_formula.py \
            --version "${VERSION#v}" \
            --repository "$GITHUB_REPOSITORY" \
            --sha256sums sha256sums.txt \
            --output tap/Formula/bb.rb

          cd tap
          git config credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "${TAP_GITHUB_TOKEN}"; }; f'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bb.rb
          git diff --cached --quiet || git commit -m "Update bb to ${VERSION}"
          git push
