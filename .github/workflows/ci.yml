name: CI

# next is the v4 integration branch (issue #487). It is listed here because a
# workflow that triggers only on main leaves the train branch ungated: a pull
# request into next would report no checks at all, and CI Complete -- the one
# required status -- would never appear.
on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr-validation:
    name: ADR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      - name: Validate ADR records
        run: task quality:validate-decisions

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      # First, because they take seconds and the test run takes minutes. A
      # formatting failure reported after a three-minute suite is a worse
      # experience for no benefit.
      - name: Verify formatting
        run: task quality:format:verify

      - name: Verify line endings
        run: task quality:line-endings:verify

      # The linter is built from source, and setup-go's cache cannot keep it:
      # that cache is keyed on go.sum, so it hits and is therefore never
      # re-saved, and the linter's build output never enters it. The result was
      # two minutes and fourteen seconds of every unit job spent rebuilding
      # golangci-lint for three seconds of analysis. This caches the built
      # binary instead, keyed on the things that decide what it is.
      - name: Resolve the pinned linter version
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Build the pinned linter if the cache did not have it
        run: task tools:golangci-lint

      - name: Lint
        run: task quality:lint

      # bb ships signed binaries to five package managers, and nothing else in
      # the pipeline would surface a CVE in a dependency or in the toolchain.
      # Its first run found five: the pinned Go toolchain was five patches
      # behind, which is why go.mod now carries a toolchain directive.
      - name: Check for known vulnerabilities
        run: task quality:vulncheck

      # The same package set the pre-commit hook runs, with a coverage profile
      # attached. It used to run here without one and again inside the live job
      # with one -- the same tests twice, the second time on the critical path
      # behind a four-minute Bitbucket boot it does not need.
      - name: Run Go tests with coverage (targeted non-live package scope)
        run: task test:unit:coverage

      - name: Upload unit coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile-unit
          path: .tmp/coverage.unit.out
          retention-days: 14
          if-no-files-found: warn

      # The live suite is tagged, so the step above never compiles it and a
      # break in it surfaced only once the live job had run for eight minutes.
      # This builds and links it in about three seconds. It does not catch a
      # stale assertion -- only the live job does.
      - name: Verify the live-tagged test tree still compiles
        run: task test:live:compile

      # Generated code was never verified in CI, which is how the sanitizer's
      # nondeterministic operationId suffixing went unnoticed.
      - name: Verify generated models and client are current
        run: task models:verify && task client:verify

      - name: Verify the vendored OpenAPI spec matches the harness release
        run: task openapi:verify

      # Guards against an operation this project calls quietly moving to a
      # different endpoint. It ran only in the local pre-push hook, so the
      # artifact drifted 468 operations out of date on main without CI
      # objecting.
      - name: Verify generated operation paths are current
        run: task openapi:operation-paths:verify

      - name: Verify OpenAPI spec coverage artifact is current
        run: task quality:spec-coverage:verify

      # Catches commands that no live test proves work, including ones whose only
      # live test skips itself when the call fails.
      - name: Verify command reach has not regressed
        run: task quality:command-reach:verify

      # Catches documented commands that do not parse against the real command
      # tree. Six had accumulated by v2.0.2, including the README quickstart and
      # the agent skill, which agents emit verbatim.
      - name: Verify documented bb invocations are valid
        run: task docs:lint

      # The docs job builds the site from freshly generated artifacts, which
      # passes whether or not the committed copies match. Nothing in CI compared
      # the two, so a schema change with its regenerated files left uncommitted
      # went green.
      - name: Verify committed generated docs artifacts are current
        run: task docs:verify-generated

  docs-site:
    name: Docs Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      - name: Render changelog for docs validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate > .tmp/releases.json
          python scripts/render_docs_changelog.py --releases-json .tmp/releases.json --releases-page-url "https://github.com/${GITHUB_REPOSITORY}/releases" --output docs/site/changelog.md

      - name: Build docs site
        run: task docs:validate

  # Three jobs rather than one, because they fail for unrelated reasons and a
  # single job made every one of them read as "Live Integration Tests failed".
  # A patch-coverage breach reported under that name sends the reader looking
  # for a broken test that does not exist.
  live-tests:
    name: Live Integration Tests
    runs-on: ubuntu-latest
    # Runs on fork pull requests too.  The Bitbucket instance is provisioned and
    # licensed by the Atlassian Plugin SDK (docker/harness), so no repository
    # secret is involved and there is nothing that a fork cannot obtain.
    timeout-minutes: 40
    env:
      BITBUCKET_URL: http://localhost:7990
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.48.0

      # BUILDKIT_PROGRESS=plain stops the builder redrawing its step table,
      # which a CI log records as a fresh copy of the whole table each time.
      - name: Start Bitbucket stack
        env:
          BUILDKIT_PROGRESS: plain
        run: docker compose -f docker/compose.yml up -d --wait

      - name: Bootstrap Bitbucket (enable basic auth for admin API calls)
        run: bash scripts/bootstrap-bitbucket.sh "$BITBUCKET_URL" "$ADMIN_USER" "$ADMIN_PASSWORD"

      - name: Run live integration tests with coverage
        run: task test:live:coverage

      # The handoff to the coverage gates. Uploaded on failure too: when the
      # suite fails it is still worth seeing what it covered.
      - name: Upload live coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile-live
          path: .tmp/coverage.live.out
          retention-days: 14
          if-no-files-found: warn

      - name: Dump Bitbucket logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color --tail 400 bitbucket

      - name: Stop Bitbucket stack
        if: always()
        run: docker compose -f docker/compose.yml down

  coverage-gates:
    name: Coverage Gates
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - live-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The patch gate diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download unit coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage-profile-unit
          path: .tmp

      - name: Download live coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage-profile-live
          path: .tmp

      # The patch gate diffs against the branch this pull request actually
      # targets, not against main. On a long-lived integration branch -- the v4
      # milestone is one -- diffing against main would report the whole
      # divergence as the patch, which is neither reviewable nor passable.
      - name: Fetch the base ref the patch gate diffs against
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          echo "COVERAGE_BASE_REF=origin/$BASE_REF" >> "$GITHUB_ENV"
          echo "Patch coverage is measured against origin/$BASE_REF"

      - name: Resolve coverage thresholds
        run: |
          set -euo pipefail

          thresholds_file=.github/coverage-thresholds.env
          if [ ! -f "$thresholds_file" ]; then
            echo "Missing coverage thresholds file: $thresholds_file" >&2
            exit 1
          fi

          # shellcheck disable=SC1091
          source "$thresholds_file"

          # No fallback defaults here. ADR-065 gives the thresholds one home and
          # the Taskfile reads that file via dotenv, so a default written here
          # would be a second statement of the same policy -- and it would apply
          # exactly when the two could disagree, a key renamed or dropped from
          # the env file. CI would then quietly gate on 85 while a local run
          # gated on nothing. Missing is an error, not a number.
          COVERAGE_MIN_GLOBAL_COMBINED="${CI_COVERAGE_MIN_GLOBAL_COMBINED:?not set in $thresholds_file}"
          COVERAGE_MIN_PATCH="${CI_COVERAGE_MIN_PATCH:?not set in $thresholds_file}"
          COVERAGE_MIN_PATCH_LINES="${CI_COVERAGE_MIN_PATCH_LINES:?not set in $thresholds_file}"
          COVERAGE_MAX_UNCOVERED_SMALL_PATCH="${CI_COVERAGE_MAX_UNCOVERED_SMALL_PATCH:?not set in $thresholds_file}"

          for var in COVERAGE_MIN_GLOBAL_COMBINED COVERAGE_MIN_PATCH COVERAGE_MIN_PATCH_LINES COVERAGE_MAX_UNCOVERED_SMALL_PATCH; do
            value="${!var}"
            if ! [[ "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "Invalid numeric value for $var: $value" >&2
              exit 1
            fi
          done

          {
            echo "COVERAGE_MIN_GLOBAL_COMBINED=$COVERAGE_MIN_GLOBAL_COMBINED"
            echo "COVERAGE_MIN_PATCH=$COVERAGE_MIN_PATCH"
            echo "COVERAGE_MIN_PATCH_LINES=$COVERAGE_MIN_PATCH_LINES"
            echo "COVERAGE_MAX_UNCOVERED_SMALL_PATCH=$COVERAGE_MAX_UNCOVERED_SMALL_PATCH"
          } >> "$GITHUB_ENV"

      - name: Verify coverage quality gates
        run: |
          go run ./tools/quality-report \
            -coverprofile .tmp/coverage.unit.out \
            -live-coverprofile .tmp/coverage.live.out \
            -base-ref "$COVERAGE_BASE_REF" \
            -scoped-coverprofile-file .tmp/coverage.combined.scoped.out \
            -write-coverprofiles \
            -min-global-combined "$COVERAGE_MIN_GLOBAL_COMBINED" \
            -min-patch "$COVERAGE_MIN_PATCH" \
            -min-patch-lines "$COVERAGE_MIN_PATCH_LINES" \
            -max-uncovered-small-patch "$COVERAGE_MAX_UNCOVERED_SMALL_PATCH"

      # Written before the thresholds are enforced, so it exists even when the
      # gate fails -- which is exactly when someone wants to read it.
      - name: Upload scoped coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile-scoped
          path: .tmp/coverage.combined.scoped.out
          retention-days: 14
          if-no-files-found: warn

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    needs:
      - live-tests
      - coverage-gates
    # Publishes coverage history and the README badge. It runs when the gates
    # ran, pass or fail, because a red build's coverage is still the number the
    # badge should report.
    #
    # It must not run when the gates were skipped. Coverage Gates needs both
    # test jobs, so a unit test failure skips it, and Codecov then failed trying
    # to download an artifact that was never produced -- turning one real
    # failure into two red jobs and burying the one that mattered.
    if: always() && needs.coverage-gates.result != 'skipped' && needs.coverage-gates.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download scoped coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage-profile-scoped
          path: .tmp

      - name: Upload combined scoped coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          # Pin the destination to the current repository name.  Without it the
          # upload was routed to the slug the project carried before it was
          # renamed, and silently discarded during processing.
          slug: ${{ github.repository }}
          files: .tmp/coverage.combined.scoped.out
          flags: combined_scoped
          fail_ci_if_error: true
          # The file is named above, so the uploader has nothing to look for.
          # Left searching, it hunts for coverage in every language it supports
          # and warns about each one it cannot find -- xcrun, gcov, coverage.py
          # -- none of which this repository has ever had.
          disable_search: true
          plugins: noop
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # fail_ci_if_error only covers the uploader's own exit code.  Processing is
      # asynchronous, so "queued for processing" kept CI green for two months
      # while Codecov dropped every report after the repository rename.  Poll
      # until the commit actually lands.
      - name: Verify Codecov processed the upload
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          api="https://api.codecov.io/api/v2/github/${GITHUB_REPOSITORY_OWNER}/repos/${GITHUB_REPOSITORY#*/}/commits/${COMMIT_SHA}"
          deadline=$(( SECONDS + 300 ))

          while (( SECONDS < deadline )); do
            # `|| state=""` because the runner already invokes this with
            # `bash -e -o pipefail`, so a curl that returns 404 -- which is
            # precisely what "Codecov has not processed the commit yet" looks
            # like -- killed the step on the first poll with exit 22. The retry
            # loop could only ever succeed when no retry was needed.
            state=$(curl -fsS "$api" 2>/dev/null | jq -r '.state // empty') || state=""
            if [ "$state" = "complete" ]; then
              echo "Codecov processed ${COMMIT_SHA}."
              exit 0
            fi
            sleep 15
          done

          echo "Codecov never processed ${COMMIT_SHA} after 5 minutes." >&2
          echo "Checked: ${api}" >&2
          echo "The upload was accepted but dropped during processing." >&2

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            exit 1
          fi

          echo "::warning::Codecov did not process this commit; not failing a pull request build."

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - adr-validation
      - unit-tests
      - docs-site
      - live-tests
      - coverage-gates
      - codecov
    if: always()
    steps:
      - name: Verify all required CI jobs passed
        env:
          ADR_VALIDATION_RESULT: ${{ needs.adr-validation.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          DOCS_SITE_RESULT: ${{ needs.docs-site.result }}
          LIVE_TESTS_RESULT: ${{ needs.live-tests.result }}
          COVERAGE_GATES_RESULT: ${{ needs.coverage-gates.result }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
        run: |
          [[ "$ADR_VALIDATION_RESULT" == "success" ]]
          [[ "$UNIT_TESTS_RESULT" == "success" ]]
          [[ "$DOCS_SITE_RESULT" == "success" ]]
          # Live tests no longer skip on forks: the Bitbucket instance is
          # SDK-licensed and needs no repository secret, so "skipped" would now
          # mean the primary correctness gate silently did not run.
          [[ "$LIVE_TESTS_RESULT" == "success" ]]
          [[ "$COVERAGE_GATES_RESULT" == "success" ]]
          # Codecov publishes the badge and history; it is not a correctness
          # gate, and on a fork without the token its steps are skipped, so the
          # job legitimately reports success having uploaded nothing.
          [[ "$CODECOV_RESULT" == "success" ]]
