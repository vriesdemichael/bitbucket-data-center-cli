version: '3'

vars:
  OAPI_CODEGEN_VERSION: v2.4.1
  # The Bitbucket release under test lives in exactly one place, the harness base
  # image tag (ADR-042). The vendored OpenAPI reference is derived from it rather
  # than pinned separately, so the two cannot drift apart.
  BITBUCKET_OPENAPI_SPEC: docs/reference/atlassian/bitbucket-openapi.json
  BITBUCKET_OPENAPI_SANITIZED_TMP: .tmp/bitbucket-openapi.sanitized.json
  DOCS_PROJECT_DIR: docs
  COVERAGE_BASE_REF: origin/main
  COVERAGE_MIN_GLOBAL_COMBINED: "85"
  COVERAGE_MIN_PATCH: "85"
  COVERAGE_MIN_PATCH_LINES: "30"
  COVERAGE_MAX_UNCOVERED_SMALL_PATCH: "2"
  COVERAGE_MIN_CONTRACT: "0"

tasks:
  default:
    desc: Show available tasks
    cmd: task --list

  openapi:refresh:
    desc: Vendor the Atlassian OpenAPI reference for the Bitbucket release the harness runs
    cmds:
      - go run ./tools/openapi-spec -refresh -spec '{{.BITBUCKET_OPENAPI_SPEC}}'

  openapi:verify:
    desc: Verify the vendored OpenAPI reference matches the Bitbucket release the harness runs
    cmds:
      - go run ./tools/openapi-spec -spec '{{.BITBUCKET_OPENAPI_SPEC}}'

  openapi:operation-paths:
    desc: Record which endpoint each generated operation this project calls targets
    cmds:
      - go run ./tools/openapi-operation-paths

  openapi:operation-paths:verify:
    desc: Verify no generated operation this project calls has been re-pointed at another endpoint
    cmds:
      - go run ./tools/openapi-operation-paths -verify

  docs:build:
    desc: Build MkDocs site with strict checks
    cmds:
      - task: docs:generate
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mkdocs build --strict

  docs:validate:
    desc: Validate MkDocs configuration/content without publishing
    cmds:
      - mkdir -p .tmp
      - task: docs:generate
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mkdocs build --strict --site-dir .tmp/mkdocs-validate

  docs:export-command-reference:
    desc: Export generated command reference markdown from Cobra command tree
    cmd: go run ./tools/cli-docs-export -out docs/site/reference/commands/index.md

  docs:export-adr-markdown:
    desc: Export ADR markdown pages from decision YAML records
    cmd: go run ./tools/adr-markdown-export -in docs/decisions -out docs/site/adr

  docs:publish-bulk-schemas:
    desc: Publish bulk JSON schema files into MkDocs docs directory
    cmds:
      - mkdir -p docs/site/reference/schemas
      - cp docs/reference/schemas/bulk-policy.schema.json docs/site/reference/schemas/bulk-policy.schema.json
      - cp docs/reference/schemas/bulk-plan.schema.json docs/site/reference/schemas/bulk-plan.schema.json
      - cp docs/reference/schemas/bulk-apply-status.schema.json docs/site/reference/schemas/bulk-apply-status.schema.json

  docs:publish-output-schemas:
    desc: Publish per-command output JSON schema files into MkDocs docs directory
    cmds:
      - mkdir -p docs/site/reference/schemas/output
      - cp docs/reference/schemas/output/*.schema.json docs/site/reference/schemas/output/

  docs:generate:
    desc: Generate all docs artifacts committed to repo
    cmds:
      - task: docs:export-command-reference
      - task: docs:export-adr-markdown
      - task: docs:export-bulk-schemas
      - task: docs:publish-bulk-schemas
      - task: docs:export-output-schemas
      - task: docs:publish-output-schemas

  docs:verify-generated:
    desc: Verify generated docs artifacts are up to date
    cmds:
      - task: docs:generate
      - git diff --exit-code -- docs/site/reference/commands/index.md docs/site/adr docs/reference/schemas docs/site/reference/schemas

  docs:sync-version:
    desc: Sync documented release versions across markdown files to match latest git tag (or VERSION)
    cmds:
      - go run ./tools/docs-lint -update-version {{if .VERSION}}-version '{{.VERSION}}'{{end}}

  docs:serve:
    desc: Serve MkDocs site locally
    cmds:
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mkdocs serve --dev-addr 127.0.0.1:8000

  docs:deploy-version:
    desc: Deploy versioned docs to gh-pages via mike (requires VERSION)
    requires:
      vars:
        - VERSION
    # The version reaches the pages through BB_DOCS_VERSION, which docs/main.py
    # reads at build time. Nothing is rewritten on disk, so a release no longer
    # leaves the checked-in sources a version behind.
    env:
      BB_DOCS_VERSION: '{{.VERSION}}'
    cmds:
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mike deploy --push --update-aliases {{.VERSION}} latest
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mike set-default --push latest

  docs:bootstrap-pages:
    desc: Bootstrap initial gh-pages docs publish (requires VERSION)
    requires:
      vars:
        - VERSION
    cmds:
      - task docs:deploy-version VERSION={{.VERSION}}

  models:generate:
    desc: Generate Go models from the vendored Bitbucket OpenAPI spec
    cmds:
      - mkdir -p internal/models/generated
      - go run ./tools/openapi-sanitize -in {{.BITBUCKET_OPENAPI_SPEC}} -out {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config tools/oapi-codegen/bitbucket-types.yaml {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - go run ./tools/oapi-fix-generated -file internal/models/generated/bitbucket_types.gen.go
      - gofmt -w internal/models/generated/bitbucket_types.gen.go

  models:verify:
    desc: Verify generated models are up to date
    cmds:
      - task: models:generate
      - git diff --exit-code -- internal/models/generated/bitbucket_types.gen.go

  client:generate:
    desc: Generate Go OpenAPI client from the vendored Bitbucket OpenAPI spec
    cmds:
      - mkdir -p internal/openapi/generated
      - go run ./tools/openapi-sanitize -in {{.BITBUCKET_OPENAPI_SPEC}} -out {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config tools/oapi-codegen/bitbucket-client.yaml {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - gofmt -w internal/openapi/generated/bitbucket_client.gen.go

  client:verify:
    desc: Verify generated OpenAPI client is up to date
    cmds:
      - task: client:generate
      - git diff --exit-code -- internal/openapi/generated/bitbucket_client.gen.go

  quality:validate-decisions:
    desc: Validate ADR decision records with Go validator
    cmd: go run ./tools/adr-validator --validate

  docs:export-bulk-schemas:
    desc: Export JSON Schemas for bulk policy artifacts
    cmd: go run ./tools/bulk-schema-export -out docs/reference/schemas

  docs:export-output-schemas:
    desc: Export per-command JSON output schemas for the bb.machine v2 envelope
    cmd: go run ./tools/output-schema-export -out docs/reference/schemas/output

  quality:git:ensure-linear:
    desc: Fail when branch contains merge commits relative to origin/main
    cmds:
      - git fetch origin main
      - |
        merge_count="$(git rev-list --count --merges origin/main..HEAD)"
        if [ "$merge_count" != "0" ]; then
          echo "Branch must be linear (rebase-only). Found $merge_count merge commit(s) in origin/main..HEAD."
          git log --oneline --merges origin/main..HEAD
          exit 1
        fi
        echo "Branch is linear (no merge commits in origin/main..HEAD)."

  quality:check:
    desc: Run core quality checks that need no Bitbucket instance
    deps:
      - quality:git:ensure-linear
      - quality:verify

  pr:rebase:
    desc: Rebase the current branch onto origin/main
    cmds:
      - git fetch origin --prune
      - git rebase origin/main

  quality:verify:
    desc: Run every quality gate that needs no Bitbucket instance (fast; matches what CI checks before the live job)
    cmds:
      - task: openapi:verify
      - task: openapi:operation-paths:verify
      - task: quality:format:verify
      - task: quality:line-endings:verify
      - task: quality:validate-decisions
      - task: quality:spec-coverage:verify
      - task: quality:cli-live-coverage:verify
      - task: docs:lint
      - task: docs:verify-generated

  docs:lint:
    desc: Validate every documented bb invocation against the real Cobra command tree
    cmds:
      - go run ./tools/docs-lint

  quality:format:verify:
    desc: Verify the Go tree is gofmt-clean
    cmds:
      - |
        unformatted=$(gofmt -l ./cmd ./internal ./tools)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-clean:" >&2
          echo "$unformatted" >&2
          echo "" >&2
          echo "Fix with: gofmt -w ./cmd ./internal ./tools" >&2
          exit 1
        fi

  quality:line-endings:verify:
    desc: Verify no committed file contains a carriage return
    cmds:
      # Checks the committed blobs, not the working tree. .gitattributes pins
      # every checkout to LF, so a CR reaching the index means something wrote
      # around git — and CRLF here breaks container entrypoints and makes tools
      # that parse repository text see \r inside the last token.
      - |
        offenders=$(git grep --cached -I -l "$(printf '\r')" -- . || true)
        if [ -n "$offenders" ]; then
          echo "Committed files contain carriage returns:" >&2
          echo "$offenders" >&2
          echo "" >&2
          echo "Fix with: git add --renormalize ." >&2
          exit 1
        fi

  quality:coverage:
    desc: Run combined (unit + live) global + patch coverage checks and generated-operation coverage metric
    cmds:
      - git fetch origin main
      - task: test:unit:coverage
      - task: test:live:coverage
      - go run ./tools/quality-report -coverprofile .tmp/coverage.unit.out -live-coverprofile .tmp/coverage.live.out -base-ref {{.COVERAGE_BASE_REF}} -manifest docs/quality/generated-operation-contracts.json -min-global-combined {{.COVERAGE_MIN_GLOBAL_COMBINED}} -min-patch {{.COVERAGE_MIN_PATCH}} -min-patch-lines {{.COVERAGE_MIN_PATCH_LINES}} -max-uncovered-small-patch {{.COVERAGE_MAX_UNCOVERED_SMALL_PATCH}} -min-contract {{.COVERAGE_MIN_CONTRACT}}

  quality:coverage:origin-main:
    desc: Run combined (unit + live) global + patch coverage gates against origin/main (requires live infra)
    cmds:
      - git fetch origin main
      - task: test:unit:coverage
      - task: test:live:coverage
      - go run ./tools/quality-report -coverprofile .tmp/coverage.unit.out -live-coverprofile .tmp/coverage.live.out -base-ref origin/main -manifest docs/quality/generated-operation-contracts.json -min-global-combined {{.COVERAGE_MIN_GLOBAL_COMBINED}} -min-patch {{.COVERAGE_MIN_PATCH}} -min-patch-lines {{.COVERAGE_MIN_PATCH_LINES}} -max-uncovered-small-patch {{.COVERAGE_MAX_UNCOVERED_SMALL_PATCH}} -min-contract {{.COVERAGE_MIN_CONTRACT}}

  quality:coverage:replay:
    desc: Re-run the coverage gates against the profiles already in .tmp/ (seconds; no tests, no live infra)
    preconditions:
      - sh: test -f .tmp/coverage.unit.out
        msg: ".tmp/coverage.unit.out is missing — run `task test:unit:coverage` first"
      - sh: test -f .tmp/coverage.live.out
        msg: ".tmp/coverage.live.out is missing — run `task test:live:coverage` first (needs the stack up)"
    cmds:
      - go run ./tools/quality-report -coverprofile .tmp/coverage.unit.out -live-coverprofile .tmp/coverage.live.out -base-ref origin/main -manifest docs/quality/generated-operation-contracts.json -min-global-combined {{.COVERAGE_MIN_GLOBAL_COMBINED}} -min-patch {{.COVERAGE_MIN_PATCH}} -min-patch-lines {{.COVERAGE_MIN_PATCH_LINES}} -max-uncovered-small-patch {{.COVERAGE_MAX_UNCOVERED_SMALL_PATCH}} -min-contract {{.COVERAGE_MIN_CONTRACT}}

  quality:spec-coverage:
    desc: Print OpenAPI spec path coverage across both transports (generated client + raw httpclient)
    cmds:
      - go run ./tools/quality-report -spec-coverage

  quality:spec-coverage:update:
    desc: Update committed OpenAPI spec coverage artifact (CI-safe, no live execution)
    cmds:
      - go run ./tools/quality-report -spec-coverage -write-report -spec-coverage-file docs/quality/spec-coverage.json

  quality:spec-coverage:verify:
    desc: Verify committed OpenAPI spec coverage artifact is current (CI-safe, no live execution)
    cmds:
      - go run ./tools/quality-report -spec-coverage -verify-report -spec-coverage-file docs/quality/spec-coverage.json

  quality:cli-live-coverage:
    desc: Print which CLI commands the live suite proves work against a real Bitbucket
    cmds:
      - go run ./tools/cli-live-coverage

  quality:cli-live-coverage:update:
    desc: Update the committed CLI live coverage baseline
    cmds:
      - go run ./tools/cli-live-coverage -write

  quality:cli-live-coverage:verify:
    desc: Fail when a command loses live coverage, arrives without it, or is masked by a skip-on-error test (CI-safe, no live execution)
    cmds:
      - go run ./tools/cli-live-coverage -verify

  test:unit:
    desc: Run Go unit tests
    cmd: go test ./cmd/... ./internal/... ./tools/...

  test:go:safe:
    desc: Run targeted non-live Go tests over maintained Go packages
    cmd: go test ./cmd/... ./internal/... ./tools/...

  test:unit:coverage:
    desc: Run Go unit tests with coverage profile output
    cmds:
      - mkdir -p .tmp
      - go test -covermode=count -coverprofile=.tmp/coverage.unit.out ./cmd/... ./internal/... ./tools/...
      - go tool cover -func=.tmp/coverage.unit.out | tail -n 1

  test:live:coverage:
    desc: Run live integration tests with coverage profile output over hand-written packages
    cmds:
      - mkdir -p .tmp
      - go test -tags=live -timeout 20m -covermode=count -coverpkg=./cmd/...,./internal/...,./tools/... -coverprofile=.tmp/coverage.live.out ./tests/integration/live
      - go tool cover -func=.tmp/coverage.live.out | tail -n 1

  test:live:
    desc: Run live integration tests against local Bitbucket stack
    cmd: go test -tags=live -timeout 20m ./tests/integration/live

  stack:up:
    desc: Start local SDK-licensed Bitbucket stack (no licence key required)
    cmds:
      # --wait makes this fail when the healthcheck is unhealthy, which is what
      # catches an aged licence: `docker compose up -d` reuses a running
      # container rather than recreating it, so a stale instance would otherwise
      # be reported as started. Docker's own message says only "container is
      # unhealthy", so the remedy is spelled out here.
      - |
        if ! docker compose -f docker/compose.yml up -d --wait; then
          echo "" >&2
          echo "The stack did not come up healthy." >&2
          echo "" >&2
          echo "The usual cause is the SDK licence ageing out: it lasts three hours" >&2
          echo "from container start, and 'up' reuses a running container instead of" >&2
          echo "reissuing it. Check with 'task stack:status', then:" >&2
          echo "" >&2
          echo "    task stack:restart" >&2
          echo "" >&2
          echo "If it is a cold start instead, the first run downloads ~800MB and can" >&2
          echo "exceed the start period; 'task stack:logs' shows progress." >&2
          exit 1
        fi

  stack:down:
    desc: Stop local Bitbucket stack
    cmd: docker compose -f docker/compose.yml down

  stack:reset:
    desc: Tear down stack and delete all data volumes (full clean restart)
    cmds:
      - docker compose -f docker/compose.yml down --volumes --remove-orphans
      - task: stack:up

  stack:restart:
    desc: Restart local Bitbucket stack (also issues a fresh 3h SDK licence)
    cmds:
      - task: stack:down
      - task: stack:up

  stack:status:
    desc: Show local stack status and how long the SDK licence has left
    cmds:
      - docker compose -f docker/compose.yml ps
      # Reads the same marker the healthcheck does, so the two cannot disagree.
      # Knowing this before starting an hour of work is the point: the licence
      # expiring mid-run produces a failure that looks like a product bug.
      - |
        issued=$(docker exec bb-bitbucket cat /tmp/licence-issued-at 2>/dev/null || true)
        if [ -z "$issued" ]; then
          echo "SDK licence: unknown (container not running)"
          exit 0
        fi
        remaining=$(( issued + 10800 - $(date +%s) ))
        if [ "$remaining" -le 0 ]; then
          echo "SDK licence: EXPIRED $(( -remaining / 60 ))m ago - run 'task stack:restart'"
        else
          echo "SDK licence: $(( remaining / 60 ))m remaining (healthcheck retires the container at 2h45m)"
        fi

  stack:logs:
    desc: Tail Bitbucket service logs
    cmd: docker compose -f docker/compose.yml logs -f bitbucket
