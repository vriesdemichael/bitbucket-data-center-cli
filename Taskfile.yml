version: '3'

# Coverage thresholds have one home (ADR-065). They used to be stated here, in
# .github/coverage-thresholds.env, and in ADR-005's prose, so a local run and a
# CI run could disagree about what the gate was -- and the failure mode is a
# developer who believes a gate passed. The workflow sources this same file.
dotenv: ['.github/coverage-thresholds.env', '.github/tool-versions.env']

env:
  # Material for MkDocs prints an advisory about MkDocs 2.0 on every build. It
  # is not about this site: mkdocs is pinned to 1.6.x, and Dependabot leaves a
  # major bump for review. Every mkdocs and mike run goes through a task, CI and
  # the release included, so this silences it everywhere.
  NO_MKDOCS_2_WARNING: "1"

vars:
  OAPI_CODEGEN_VERSION: v2.4.1
  # The Bitbucket release under test lives in exactly one place, the harness base
  # image tag (ADR-042). The vendored OpenAPI reference is derived from it rather
  # than pinned separately, so the two cannot drift apart.
  BITBUCKET_OPENAPI_SPEC: docs/reference/atlassian/bitbucket-openapi.json
  BITBUCKET_OPENAPI_SANITIZED_TMP: .tmp/bitbucket-openapi.sanitized.json
  # How many live tests run at once.
  #
  # Stated rather than left to Go's default of GOMAXPROCS, which is the right
  # shape for a suite bound by the machine and the wrong one for this suite: it
  # spends its time waiting on Bitbucket. The default ran four live tests at a
  # time on a GitHub runner and twenty on a developer machine, so the same
  # command meant a different thing in each place -- a difference in how long it
  # takes rather than in what it proves. A number here makes the two agree.
  # Override LIVE_PARALLEL when pointing the suite at an instance that cannot
  # take it, or raise it for a machine and a Bitbucket that can.
  LIVE_PARALLEL: '12'
  DOCS_PROJECT_DIR: docs
  # The branch a change is measured against, which is the branch it targets:
  # everything targets next (ADR-066), and main is 140 commits behind it between
  # promotions, so diffing against main read the whole train as one patch.
  # Override it when working against another base.
  COVERAGE_BASE_REF: origin/next

tasks:
  default:
    desc: Show available tasks
    cmd: task --list

  openapi:refresh:
    desc: Vendor the Atlassian OpenAPI reference for the Bitbucket release the harness runs
    cmds:
      - go run ./tools/openapi-spec -refresh -spec '{{.BITBUCKET_OPENAPI_SPEC}}'

  openapi:verify:
    desc: Verify the vendored OpenAPI reference matches the Bitbucket release the harness runs
    cmds:
      - go run ./tools/openapi-spec -spec '{{.BITBUCKET_OPENAPI_SPEC}}'

  openapi:operation-paths:
    desc: Record which endpoint each generated operation this project calls targets
    cmds:
      - go run ./tools/openapi-operation-paths

  openapi:operation-paths:verify:
    desc: Verify no generated operation this project calls has been re-pointed at another endpoint
    cmds:
      - go run ./tools/openapi-operation-paths -verify

  docs:build:
    desc: Build MkDocs site with strict checks
    cmds:
      - task: docs:generate
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mkdocs build --strict

  docs:validate:
    desc: Validate MkDocs configuration/content without publishing
    cmds:
      - mkdir -p .tmp
      - task: docs:generate
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mkdocs build --strict --site-dir .tmp/mkdocs-validate

  docs:export-command-reference:
    desc: Export generated command reference markdown from Cobra command tree
    cmd: go run ./tools/cli-docs-export -out docs/site/reference/commands/index.md

  docs:export-adr-markdown:
    desc: Export ADR markdown pages from decision YAML records
    cmd: go run ./tools/adr-markdown-export -in docs/decisions -out docs/site/adr

  docs:export-mcp-tools:
    desc: Export the MCP tool reference from the server's tool registry
    cmd: go run ./tools/mcp-docs-export -out docs/site/reference/mcp-tools.md

  docs:export-bulk-schemas:
    desc: Export JSON Schemas for bulk policy artifacts
    cmd: go run ./tools/bulk-schema-export -out docs/reference/schemas

  docs:export-config-schema:
    desc: Export JSON Schema for bb configuration and policy files
    cmd: go run ./tools/config-schema-export -out docs/reference/schemas

  docs:export-output-schemas:
    desc: Export the --json envelope schemas, including the failure envelope
    cmd: go run ./tools/output-schema-export -out docs/reference/schemas/output

  docs:publish-output-schemas:
    desc: Publish the envelope schemas into the MkDocs docs directory
    cmds:
      - mkdir -p docs/site/reference/schemas/output
      - cp docs/reference/schemas/output/*.schema.json docs/site/reference/schemas/output/

  docs:publish-bulk-schemas:
    desc: Publish bulk JSON schema files into MkDocs docs directory
    cmds:
      - mkdir -p docs/site/reference/schemas
      - cp docs/reference/schemas/bulk-policy.schema.json docs/site/reference/schemas/bulk-policy.schema.json
      - cp docs/reference/schemas/bulk-plan.schema.json docs/site/reference/schemas/bulk-plan.schema.json
      - cp docs/reference/schemas/bulk-apply-status.schema.json docs/site/reference/schemas/bulk-apply-status.schema.json

  docs:publish-config-schema:
    desc: Publish config JSON schema file into MkDocs docs directory
    cmds:
      - mkdir -p docs/site/reference/schemas
      - cp docs/reference/schemas/config.schema.json docs/site/reference/schemas/config.schema.json

  docs:generate:
    desc: Generate all docs artifacts committed to repo
    cmds:
      - task: docs:export-command-reference
      - task: docs:export-adr-markdown
      - task: docs:export-mcp-tools
      - task: docs:export-bulk-schemas
      - task: docs:publish-bulk-schemas
      - task: docs:export-config-schema
      - task: docs:export-output-schemas
      - task: docs:publish-output-schemas
      - task: docs:publish-config-schema

  docs:verify-generated:
    desc: Verify generated docs artifacts are up to date
    cmds:
      - task: docs:generate
      # --stat, not the whole diff. A stale artifact is named either way, and the
      # full diff runs to hundreds of kilobytes. On Windows, printing that much
      # into a pipe after the go run steps above deadlocked the task, so the check
      # hung instead of failing. `git diff` shows the change once you know where.
      - git diff --exit-code --stat -- docs/site/reference/commands/index.md docs/site/reference/mcp-tools.md docs/site/adr docs/reference/schemas docs/site/reference/schemas

  docs:sync-version:
    desc: Sync documented release versions across markdown files to match latest git tag (or VERSION)
    cmds:
      - go run ./tools/docs-lint -update-version {{if .VERSION}}-version '{{.VERSION}}'{{end}}

  docs:serve:
    desc: Serve MkDocs site locally
    cmds:
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mkdocs serve --dev-addr 127.0.0.1:8000

  docs:deploy-version:
    desc: Deploy a release's docs to gh-pages via mike, under its major version (requires VERSION)
    requires:
      vars:
        - VERSION
    # The version selector holds one entry per major. A release replaces its
    # major's build -- v4.0.1 deploys to v4 -- because an entry per release
    # makes a list nobody can pick from. The full version is the entry's title,
    # so the selector still says which release it shows, and an alias, so a
    # link or a schema $id naming a release keeps resolving.
    vars:
      DOCS_MAJOR: '{{regexReplaceAll "^(v[0-9]+)\\..*$" .VERSION "${1}"}}'
    preconditions:
      # Anything else has no major to derive, and mike would be handed one name
      # as both the version and its alias.
      - sh: '{{if regexMatch "^v[0-9]+\\.[0-9]+\\.[0-9]+$" .VERSION}}true{{else}}false{{end}}'
        msg: 'VERSION must be a release tag such as v4.0.1, got {{.VERSION}}'
    # The version reaches the pages through BB_DOCS_VERSION, which docs/main.py
    # reads at build time. It is the full version, so the pages name the release
    # they were built from rather than the major they are filed under.
    env:
      BB_DOCS_VERSION: '{{.VERSION}}'
    cmds:
      # A schema $id is a canonical identity, not an address. mike serves the
      # newest copy of the schemas under the major and under the latest alias,
      # so identifying them against either would have every release assert one
      # identity for a different document. Re-exported here, into the working
      # tree the site is built from, so the published copy names the release it
      # belongs to while the committed copies stay on the alias and
      # docs:verify-generated stays stable.
      - go run ./tools/bulk-schema-export -out docs/site/reference/schemas -site-version '{{.VERSION}}'
      - go run ./tools/output-schema-export -out docs/site/reference/schemas/output -site-version '{{.VERSION}}'
      # latest moves unconditionally: releases are cut from main in version
      # order, so the release being published belongs to the newest major.
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mike deploy --push --update-aliases --title '{{.VERSION}}' '{{.DOCS_MAJOR}}' '{{.VERSION}}' latest
      - uv run --project '{{.DOCS_PROJECT_DIR}}' mike set-default --push latest

  models:generate:
    desc: Generate Go models from the vendored Bitbucket OpenAPI spec
    cmds:
      - mkdir -p internal/models/generated
      - go run ./tools/openapi-sanitize -in {{.BITBUCKET_OPENAPI_SPEC}} -out {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config tools/oapi-codegen/bitbucket-types.yaml {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - go run ./tools/oapi-fix-generated -file internal/models/generated/bitbucket_types.gen.go
      - '"$(go env GOROOT)/bin/gofmt" -w internal/models/generated/bitbucket_types.gen.go'

  models:verify:
    desc: Verify generated models are up to date
    cmds:
      - task: models:generate
      - git diff --exit-code -- internal/models/generated/bitbucket_types.gen.go

  client:generate:
    desc: Generate Go OpenAPI client from the vendored Bitbucket OpenAPI spec
    cmds:
      - mkdir -p internal/openapi/generated
      - go run ./tools/openapi-sanitize -in {{.BITBUCKET_OPENAPI_SPEC}} -out {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config tools/oapi-codegen/bitbucket-client.yaml {{.BITBUCKET_OPENAPI_SANITIZED_TMP}}
      - '"$(go env GOROOT)/bin/gofmt" -w internal/openapi/generated/bitbucket_client.gen.go'

  client:verify:
    desc: Verify generated OpenAPI client is up to date
    cmds:
      - task: client:generate
      - git diff --exit-code -- internal/openapi/generated/bitbucket_client.gen.go

  quality:validate-decisions:
    desc: Validate ADR decision records with Go validator
    cmd: go run ./tools/adr-validator --validate

  pr:rebase:
    desc: Rebase the current branch onto origin/next
    # Every change targets next (ADR-066); main only moves when next is
    # promoted onto it.
    cmds:
      - git fetch origin --prune
      - git rebase origin/next

  quality:verify:
    desc: Run every gate a git hook can afford (seconds; the same set CI runs outside the live job)
    # The ordering claim in the description is load-bearing, so the list is kept
    # in step with .github/workflows/ci.yml deliberately. It had drifted in both
    # directions: openapi:verify, openapi:operation-paths:verify and
    # docs:verify-generated ran only here, so a stale generated artifact reached
    # main unchallenged; models:verify and client:verify ran only in CI, so the
    # first sign of regenerated code was a red pull request.
    cmds:
      - task: openapi:verify
      - task: openapi:operation-paths:verify
      - task: quality:format:verify
      - task: quality:lint
      - task: quality:vulncheck
      - task: quality:line-endings:verify
      - task: quality:validate-decisions
      - task: models:verify
      - task: client:verify
      - task: quality:spec-coverage:verify
      - task: quality:command-reach:verify
      - task: quality:mock-inventory:verify
      - task: quality:bitbucket-releases:verify
      - task: test:live:compile
      - task: docs:lint
      - task: docs:verify-generated

  docs:lint:
    desc: Validate every documented bb invocation against the real Cobra command tree
    cmds:
      - go run ./tools/docs-lint

  completion:shells:
    desc: Drive bb's completion in real bash, zsh, fish and PowerShell, set up by hand and by the .deb and .rpm, and check what the terminal shows (needs Docker)
    # The protocol bb prints can be right while a shell mishandles it: Cobra's
    # PowerShell script throws at the prompt on an empty answer, and its fish
    # script puts a space after a list element. The Go tests read the protocol;
    # this reads the screen. It needs no Bitbucket. It also builds the Linux
    # packages the way the release does and installs them, because a
    # completion file one directory off is one no shell reads.
    cmd: bash scripts/completion-shells/test.sh

  quality:lint:
    desc: Run golangci-lint over the maintained Go tree
    # A binary if one at the pinned version is on PATH, and `go run` otherwise.
    #
    # `go run pkg@version` builds the linter from source. Locally that is paid
    # once and the build cache answers in about three seconds afterwards. In CI
    # it was paid every single run -- two minutes and fourteen seconds of the
    # four-and-a-half minute unit job, for three seconds of actual analysis --
    # because setup-go's cache is keyed on go.sum, hits, and is therefore never
    # re-saved, so the linter's build output never entered it.
    #
    # The version is checked rather than assumed. A binary left on PATH by
    # something else is the one way this could silently lint with different
    # rules than the pin says, which is exactly the disagreement ADR-065 is
    # about. So is the Go it was built with: golangci-lint refuses a module
    # that targets a newer Go than its own build, and a binary installed before
    # a toolchain bump still reports the pinned version.
    cmd: |
      packages="./cmd/... ./internal/... ./tools/... ./tests/..."
      pinned="${GOLANGCI_LINT_VERSION#v}"
      built_with="built with $(go env GOVERSION) "
      if command -v golangci-lint >/dev/null 2>&1 && golangci-lint version 2>&1 | grep -F "$pinned" | grep -qF "$built_with"; then
        exec golangci-lint run $packages
      fi
      exec go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run $packages

  tools:golangci-lint:
    desc: Build the pinned golangci-lint once, so linting does not rebuild it every time
    # Built from source rather than downloaded. golangci-lint refuses to run
    # when the Go it was built with is older than the Go a module targets, and
    # the published v2.6.2 binaries are built with go1.25 against this module's
    # go1.26 -- "the Go language version used to build golangci-lint is lower
    # than the targeted Go version". Building it here uses the toolchain the
    # project already pins, which is what `go run` was doing implicitly.
    #
    # status makes this a no-op once the pinned version, built with the pinned
    # Go, is in place, so CI can call it unconditionally and pay the build only
    # on a version or toolchain bump.
    status:
      - command -v golangci-lint >/dev/null 2>&1 && golangci-lint version 2>&1 | grep -F "${GOLANGCI_LINT_VERSION#v}" | grep -qF "built with $(go env GOVERSION) "
    cmd: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

  quality:vulncheck:
    desc: Report known vulnerabilities in this module and its dependencies
    # The one check with no substitute here. bb ships signed binaries to five
    # package managers, and nothing in the pipeline would otherwise surface a
    # CVE in a transitive dependency.
    cmd: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  quality:format:verify:
    desc: Verify the Go tree is gofmt-clean
    # ./tests included: it was the one tree the formatting gate did not cover,
    # and it is the tree the linter does cover through run.build-tags. Since
    # this is now the only gofmt gate -- golangci-lint's own formatter is off,
    # see .golangci.yml -- the two scopes have to match.
    #
    # The gofmt is the one in the toolchain go.mod pins, not the first on PATH.
    # Its output changes between Go releases -- go1.26 and go1.27 each rewrite
    # the other's layout of the same literal -- so an installed Go older than
    # the pin would fail a tree CI passes.
    cmds:
      - |
        unformatted=$("$(go env GOROOT)/bin/gofmt" -l ./cmd ./internal ./tools ./tests)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-clean:" >&2
          echo "$unformatted" >&2
          echo "" >&2
          echo "Fix with: task quality:format" >&2
          exit 1
        fi

  quality:format:
    desc: Format the Go tree with the pinned toolchain's gofmt
    cmd: '"$(go env GOROOT)/bin/gofmt" -w ./cmd ./internal ./tools ./tests'

  quality:line-endings:verify:
    desc: Verify no committed file contains a carriage return
    cmds:
      # Checks the committed blobs, not the working tree. .gitattributes pins
      # every checkout to LF, so a CR reaching the index means something wrote
      # around git — and CRLF here breaks container entrypoints and makes tools
      # that parse repository text see \r inside the last token.
      - |
        offenders=$(git grep --cached -I -l "$(printf '\r')" -- . || true)
        if [ -n "$offenders" ]; then
          echo "Committed files contain carriage returns:" >&2
          echo "$offenders" >&2
          echo "" >&2
          echo "Fix with: git add --renormalize ." >&2
          exit 1
        fi

  quality:coverage:
    desc: Run the combined (unit + live) global and patch coverage gates. Needs the stack up
    # COVERAGE_BASE_REF is the branch the patch gate diffs against. It defaults
    # to next, which is what every change targets; pass another when a branch is
    # cut from somewhere else, or the whole divergence reads as the patch.
    cmds:
      - git fetch origin {{trimPrefix "origin/" .COVERAGE_BASE_REF}}
      - task: test:unit:coverage
      - task: test:live:coverage
      - go run ./tools/quality-report -coverprofile .tmp/coverage.unit.out -live-coverprofile .tmp/coverage.live.out -base-ref {{.COVERAGE_BASE_REF}} -min-global-combined {{.CI_COVERAGE_MIN_GLOBAL_COMBINED}} -min-patch {{.CI_COVERAGE_MIN_PATCH}} -min-patch-lines {{.CI_COVERAGE_MIN_PATCH_LINES}} -max-uncovered-small-patch {{.CI_COVERAGE_MAX_UNCOVERED_SMALL_PATCH}}

  quality:coverage:replay:
    desc: Re-run the coverage gates against the profiles already in .tmp/ (seconds; no tests, no live infra)
    preconditions:
      - sh: test -f .tmp/coverage.unit.out
        msg: ".tmp/coverage.unit.out is missing — run `task test:unit:coverage` first"
      - sh: test -f .tmp/coverage.live.out
        msg: ".tmp/coverage.live.out is missing — run `task test:live:coverage` first (needs the stack up)"
    cmds:
      - go run ./tools/quality-report -coverprofile .tmp/coverage.unit.out -live-coverprofile .tmp/coverage.live.out -base-ref {{.COVERAGE_BASE_REF}} -min-global-combined {{.CI_COVERAGE_MIN_GLOBAL_COMBINED}} -min-patch {{.CI_COVERAGE_MIN_PATCH}} -min-patch-lines {{.CI_COVERAGE_MIN_PATCH_LINES}} -max-uncovered-small-patch {{.CI_COVERAGE_MAX_UNCOVERED_SMALL_PATCH}}

  quality:spec-coverage:
    desc: Print OpenAPI spec path coverage across both transports (generated client + raw httpclient)
    cmds:
      - go run ./tools/quality-report -spec-coverage

  quality:spec-coverage:update:
    desc: Update committed OpenAPI spec coverage artifact (static analysis; needs no Bitbucket instance)
    cmds:
      - go run ./tools/quality-report -spec-coverage -write-report -spec-coverage-file docs/quality/spec-coverage.json

  quality:spec-coverage:verify:
    desc: Verify committed OpenAPI spec coverage artifact is current (static analysis; needs no Bitbucket instance)
    cmds:
      - go run ./tools/quality-report -spec-coverage -verify-report -spec-coverage-file docs/quality/spec-coverage.json

  quality:mock-inventory:
    desc: Print the mocked servers left in the unit suite and what each one assumes
    cmds:
      - go run ./tools/mock-inventory

  quality:mock-inventory:update:
    desc: Update the committed mocked-server inventory and the task list beside it
    cmds:
      - go run ./tools/mock-inventory -write

  quality:mock-inventory:verify:
    desc: Fail when a mocked server arrives, leaves or changes class without the record being updated (static analysis; needs no Bitbucket instance)
    cmds:
      - go run ./tools/mock-inventory -verify

  quality:bitbucket-releases:
    desc: Print the Bitbucket releases bb serves and the differences between them
    cmds:
      - go run ./tools/bitbucket-releases

  quality:bitbucket-releases:update:
    desc: Normalise the committed window of Bitbucket releases
    cmds:
      - go run ./tools/bitbucket-releases -write

  quality:bitbucket-releases:verify:
    desc: Fail when the window, the differences internal/compat declares and the versions page disagree (static analysis; needs no Bitbucket instance)
    cmds:
      - go run ./tools/bitbucket-releases -verify

  quality:command-reach:
    desc: Print which CLI commands the live suite proves work against a real Bitbucket
    cmds:
      - go run ./tools/command-reach

  quality:command-reach:update:
    desc: Update the committed command reach baseline
    cmds:
      - go run ./tools/command-reach -write

  quality:command-reach:verify:
    desc: Fail when a command loses live coverage, arrives without it, or is masked by a skip-on-error test (static analysis; needs no Bitbucket instance)
    cmds:
      - go run ./tools/command-reach -verify

  test:unit:
    desc: Run Go unit tests
    cmd: go test ./cmd/... ./internal/... ./tools/...

  test:unit:race:
    desc: Run Go unit tests under the race detector (needs cgo and a C toolchain)
    # Worth its own target now that the suite is parallel.
    #
    # Before, most packages ran their tests one at a time, so a shared variable
    # two of them wrote was never written concurrently and the detector had
    # nothing to find. Making them parallel is what turns those into races that
    # can happen -- one had already been there, a package-level writer in
    # internal/config that every test reassigned -- so the detector is now
    # checking something it previously could not.
    #
    # It needs cgo, which a Go toolchain on Windows without a C compiler does
    # not have; CI runs it on Linux.
    cmd: go test -race ./cmd/... ./internal/... ./tools/...

  test:unit:coverage:
    desc: Run Go unit tests with coverage profile output
    # -coverpkg for the same reason test:live:coverage has it: without it, Go
    # records only what a package's own tests cover in that package, so a test
    # that exercises another package is invisible. internal/services/contract
    # drives eighteen service packages and has no code of its own, so it counted
    # for nothing; every CLI test that reaches a service was under-counted the
    # same way. The measurement was wrong, not the tests.
    cmds:
      - mkdir -p .tmp
      - go test -covermode=atomic -coverpkg=./cmd/...,./internal/...,./tools/... -coverprofile=.tmp/coverage.unit.out ./cmd/... ./internal/... ./tools/...
      - go tool cover -func=.tmp/coverage.unit.out | tail -n 1

  test:live:coverage:
    desc: Run live integration tests with coverage profile output over hand-written packages
    cmds:
      - mkdir -p .tmp
      - go test -tags=live -count=1 -timeout 20m -parallel {{.LIVE_PARALLEL}} -covermode=atomic -coverpkg=./cmd/...,./internal/...,./tools/... -coverprofile=.tmp/coverage.live.out ./tests/integration/live
      - go tool cover -func=.tmp/coverage.live.out | tail -n 1

  test:live:compile:
    desc: Build and link the live-tagged test tree without running it (no Bitbucket instance)
    # The live suite carries the `live` build tag, and every routine test target
    # here is `go test ./cmd/... ./internal/... ./tools/...` -- which does not
    # match ./tests/... and does not set the tag. So nothing a developer runs
    # before pushing ever compiles the live tests, and a renamed helper or a
    # changed signature in internal/ stays invisible until the live job runs,
    # eight minutes into CI.
    #
    # `-run ^$` builds and links every live test binary and runs none of them:
    # about three seconds, no Bitbucket instance, no network.
    #
    # Its limit is worth stating plainly, because a gate that is trusted for
    # more than it does is worse than no gate. This catches live tests that no
    # longer COMPILE. It cannot catch a live test that compiles and whose
    # assertion has gone stale -- only running it does.
    cmd: go test -tags=live -run ^$ ./tests/...

  test:live:
    desc: Run live integration tests against local Bitbucket stack
    # Compiled to a fixed path and then run, rather than `go test` running it.
    #
    # One test listens on 0.0.0.0 so the Bitbucket container can deliver a
    # webhook back to the host, and a Windows firewall rule is keyed on the
    # executable's path. `go test` builds into
    # %TEMP%\go-build<random>\b001\live.test.exe and runs it from there, so
    # every run is a new program to Windows and prompts again. `go test -o`
    # does not help: it saves a copy and still runs the temporary one.
    #
    # Compiling to .tmp/live.test.exe makes it the same program each time, so
    # the prompt is answered once. Run from the package directory because that
    # is where `go test` puts a test binary's working directory, and the suite
    # resolves .env and the repository root by walking up from it.
    #
    # test:live:coverage is deliberately left on `go test`: it is what CI runs,
    # CI is Linux and headless, and the coverage plumbing is not worth
    # rearranging for a desktop prompt.
    #
    # No caching to worry about here -- running a binary directly never
    # consults the build cache, which is the right answer for a suite whose
    # subject is a server the cache cannot see.
    # The working directory is the package directory, because that is where `go
    # test` puts a test binary and one test resolves
    # testdata/live-suite-gpg-public-key.asc relative to it. Set on the task:
    # dir: is not a per-command key, and Task ignores it there without saying
    # so -- which read as the directory being set while the suite still ran
    # from the repository root and could not find its fixture.
    dir: tests/integration/live
    # RELEASE=<atlassian/bitbucket tag> runs the suite against an instance of
    # that release instead of the pinned one. The suite reads the release to
    # find that instance's own file in .tmp.
    env:
      BB_STACK_RELEASE: '{{.RELEASE}}'
    cmds:
      # The instance stops itself when its licence ages out, so a run starts it
      # rather than failing against a stopped one. A running instance is left
      # alone.
      - task: stack:up
        vars:
          RELEASE: '{{.RELEASE}}'
      - task: test:live:build
      # Absolute and forward-slashed. Task's shell reads a backslash as an
      # escape, so ROOT_DIR verbatim arrives as C:Users... and reports "not
      # found"; a relative path is not resolved against the task's dir either,
      # and reports the same thing.
      - '{{ .ROOT_DIR | replace "\\" "/" }}/.tmp/live.test.exe -test.timeout=20m -test.parallel={{.LIVE_PARALLEL}}'

  test:live:matrix:
    desc: Run the live suite against the oldest and newest Bitbucket release bb serves (RELEASES=all for the whole window)
    # Local and asked for, never scheduled: a release takes minutes to boot and
    # minutes more to run, and the whole window is hours. The releases come
    # from docs/quality/bitbucket-releases.json, so they are not listed twice.
    #
    # The ends by default, because that is where a difference shows: a call
    # that needs what the newest release has fails on the oldest. The window in
    # full is what ADR-088 asks for before a release, and RELEASES=all runs it.
    #
    # Which releases passed is a measurement, so it lands in .tmp rather than
    # in the repository (ADR-045). An instance is stopped after its release
    # passes and left up after a failure, which is what a re-run needs.
    cmds:
      - mkdir -p .tmp
      - |
        selection=-ends
        if [ "{{.RELEASES}}" = "all" ]; then selection=; fi
        summary=.tmp/bitbucket-releases-matrix.txt
        : > "$summary"
        failed=0
        for release in $(go run ./tools/bitbucket-releases -list $selection); do
          if task test:live RELEASE="$release"; then
            echo "$release: passed" >> "$summary"
            task stack:down RELEASE="$release"
          else
            echo "$release: FAILED" >> "$summary"
            failed=1
          fi
        done
        cat "$summary"
        exit "$failed"

  release:promote:check:
    desc: Verify next can fast-forward onto main, and that CI passed on it, before promoting
    # main is a release pointer and keeps a linear history, so the promotion is
    # a fast-forward push and never a pull request -- a rebase-merge would
    # replay every commit with new shas while next kept the originals, leaving
    # two copies of the same work.
    #
    # Hotfixes, and Dependabot security updates merged rather than retargeted,
    # land on main directly, so main moves ahead of next and the fast-forward
    # stops being possible. Rebasing next onto main restores it. This says which
    # of the two situations you are in.
    silent: true
    cmds:
      - git fetch --quiet origin main next
      - |
        if git merge-base --is-ancestor origin/main origin/next; then
          ahead=$(git rev-list --count origin/main..origin/next)
          echo "next is $ahead commits ahead of main and can fast-forward."
          echo "  git push origin next:main"
          # The promotion is a push, so branch protection's "CI Complete"
          # requirement never runs: it gates pull requests, and an administrator
          # pushing to main bypasses it anyway. Pushing cuts a release
          # immediately, from whatever next holds. So the check that would have
          # run is asked for here, against the commit that is about to become
          # main.
          head=$(git rev-parse origin/next)
          # jq picks the one conclusion, rather than a pipe into head: Task runs
          # its own shell, and that shell has no head on Windows -- so the check
          # died at "executable file not found" on the machine that runs it.
          ci=$(gh api "repos/{owner}/{repo}/commits/$head/check-runs" --jq '[.check_runs[] | select(.name=="CI Complete") | .conclusion] | .[0] // empty' 2>/dev/null)
          if [ "$ci" = "success" ]; then
            echo "  CI Complete: success on $(git rev-parse --short origin/next)"
          elif [ -z "$ci" ]; then
            echo "" >&2
            echo "CI Complete has not reported on $(git rev-parse --short origin/next) (or gh is not authenticated)." >&2
            echo "Pushing cuts a release from this commit, so check the run first:" >&2
            echo "  gh run list --branch next --limit 1" >&2
            exit 1
          else
            echo "" >&2
            echo "CI Complete on $(git rev-parse --short origin/next) is \"$ci\", not success." >&2
            echo "Pushing cuts a release from this commit." >&2
            exit 1
          fi
          # The last place a person looks before a major ships. Advisory:
          # promote:check is a convenience, not a gate, and a deprecation left
          # in place is a decision rather than a mistake to be blocked.
          outstanding=$(go run ./tools/deprecation-check)
          if [ -n "$outstanding" ]; then
            echo ""
            echo "Deprecations due for removal in the release this would cut:"
            echo "$outstanding"
          fi
        else
          behind=$(git rev-list --count origin/next..origin/main)
          echo "main has $behind commit(s) next does not, so the promotion is not a fast-forward." >&2
          echo "" >&2
          echo "Rebase next onto main first:" >&2
          echo "  git switch next && git fetch origin && git rebase origin/main && git push --force-with-lease origin next" >&2
          exit 1
        fi

  test:live:build:
    desc: Compile the live test binary to the fixed path test:live runs
    internal: true
    cmd: go test -tags=live -c -o .tmp/live.test.exe ./tests/integration/live

  # The stack tasks act on this checkout's own instance: the main checkout's on
  # localhost:7990, a linked worktree's on ports Docker assigns. The logic lives
  # in scripts/stack.sh, which says why. RELEASE=<atlassian/bitbucket tag> acts
  # on this checkout's instance of that release instead.
  stack:up:
    desc: Start this checkout's local Bitbucket instance and enable basic auth (no licence key required)
    cmd: bash scripts/stack.sh up {{.RELEASE}}

  stack:bootstrap:
    desc: Enable basic auth on this checkout's running instance (and apply a licence key if one is set)
    cmd: bash scripts/stack.sh bootstrap {{.RELEASE}}

  stack:down:
    desc: Stop this checkout's local Bitbucket instance
    cmd: bash scripts/stack.sh down {{.RELEASE}}

  stack:purge-fixtures:
    desc: Remove the LT* projects the live suite left on this checkout's instance (needs it up)
    cmd: bash scripts/stack.sh purge-fixtures {{.RELEASE}}

  stack:reset:
    desc: Tear down this checkout's instance and its Maven cache volume, then start it again
    cmd: bash scripts/stack.sh reset {{.RELEASE}}

  stack:restart:
    desc: Restart this checkout's instance (also issues a fresh 3h SDK licence)
    cmd: bash scripts/stack.sh restart {{.RELEASE}}

  stack:status:
    desc: Show this checkout's instance, how long before it stops itself, and every local instance
    cmd: bash scripts/stack.sh status {{.RELEASE}}

  stack:logs:
    desc: Tail this checkout's Bitbucket logs
    cmd: bash scripts/stack.sh logs {{.RELEASE}}

  stack:prune:
    desc: Remove local Bitbucket instances whose worktree no longer exists
    cmd: bash scripts/stack.sh prune
