site_name: Bitbucket Data Center CLI
site_description: CLI automation for Bitbucket Data Center
site_url: https://vriesdemichael.github.io/bitbucket-data-center-cli/
repo_url: https://github.com/vriesdemichael/bitbucket-data-center-cli
repo_name: vriesdemichael/bitbucket-data-center-cli
docs_dir: docs/site
site_dir: site

theme:
  name: material
  icon:
    logo: material/source-branch
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.top
    - navigation.tracking
    - navigation.sections
    # Lets "All Commands" be both the index page and the section holding a page
    # per top-level command.
    - navigation.indexes
    # Keeps the page's table of contents scrolled to where the reader is; the
    # longest command pages list far more headings than fit on a screen.
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange

plugins:
  # Declaring plugins replaces the default list, so search has to be named again.
  - search
  # Supplies the release version at build time from docs/main.py. Nothing in the
  # sources pins a version, so no committed file can go stale between releases.
  - macros:
      module_name: docs/main
      # The default {{ }} would eat the Ansible and Taskfile snippets the docs
      # show verbatim -- enterprise-hardening.md already contains a literal
      # {{ bb_version }} that belongs to the reader's Ansible run, not to us.
      j2_variable_start_string: "[["
      j2_variable_end_string: "]]"

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  # Definition lists: the command reference lists commands and flags with them,
  # because a table scrolls sideways on a narrow screen and a list stacks.
  - def_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  # Content tabs (=== "Bash"). Without it the cheatsheet's shell completion tabs
  # render as literal text, and a strict build does not notice.
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Installation and Quickstart: installation-and-quickstart.md
  - Developer Cheatsheet: cheatsheet.md
  - Basic Usage: basic-usage.md
  - Troubleshooting: troubleshooting.md
  - Coming from gh: gh-parity.md
  - Command Reference:
      - Overview: reference/overview.md
      # One page per top-level command, generated with the index. A test in
      # tools/cli-docs-export fails when this list and the command tree differ.
      - All Commands:
          - reference/commands/index.md
          - Global flags: reference/commands/global-flags.md
          - bb admin: reference/commands/admin.md
          - bb ai: reference/commands/ai.md
          - bb api: reference/commands/api.md
          - bb auth: reference/commands/auth.md
          - bb branch: reference/commands/branch.md
          - bb browse: reference/commands/browse.md
          - bb build: reference/commands/build.md
          - bb clone: reference/commands/clone.md
          - bb commit: reference/commands/commit.md
          - bb deployment: reference/commands/deployment.md
          - bb diff: reference/commands/diff.md
          - bb doctor: reference/commands/doctor.md
          - bb dry-run: reference/commands/dry-run.md
          - bb insights: reference/commands/insights.md
          - bb pr: reference/commands/pr.md
          - bb project: reference/commands/project.md
          - bb ref: reference/commands/ref.md
          - bb repo: reference/commands/repo.md
          - bb reviewer: reference/commands/reviewer.md
          - bb reviewer-group: reference/commands/reviewer-group.md
          - bb search: reference/commands/search.md
          - bb ssh-key: reference/commands/ssh-key.md
          - bb tag: reference/commands/tag.md
          - bb update: reference/commands/update.md
          - bb webhook: reference/commands/webhook.md
      - JSON Schemas: reference/schemas.md
      - Environment Variables: reference/environment.md
      - System Policy: reference/system-policy.md
      - Bitbucket Versions: reference/bitbucket-versions.md
      - MCP Reference: reference/mcp-tools.md
  - Advanced Topics:
      - Overview: advanced/index.md
      - Enterprise Hardening: advanced/enterprise-hardening.md
      - Security Architecture & Threat Model: advanced/threat-model.md
      - Repository Discovery and Server Switching: advanced/repository-discovery-and-server-switching.md
      - Dry-Run Planning: advanced/dry-run-planning.md
      - Git Authentication: advanced/git-authentication.md
      - Networks, Proxies and TLS: advanced/networks-proxies-and-tls.md
      - Machine Mode and Diagnostics: advanced/machine-mode-diagnostics.md
      - Shell Completion: advanced/shell-completion.md
      - Server-Side Hooks: advanced/server-side-hooks.md
      - Webhook Secrets: advanced/webhook-secrets.md
  - AI and llms.txt: ai-and-llms.md
  - ADR Records: adr/index.md
  # Linked rather than copied into docs_dir: the guide is 365 lines that change with the
  # gates it describes, and a second copy under docs/site would drift from the one
  # contributors actually open from the repository root.
  - Contributing: https://github.com/vriesdemichael/bitbucket-data-center-cli/blob/main/CONTRIBUTING.md
  - Changelog: changelog.md
